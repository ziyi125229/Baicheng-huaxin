/* 开屏 splash —— JS 没跑完前先把品牌立刻显示出来,消除空白等待感 */
.splash {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 42%, #fbf4e6 0%, #f0e3c6 52%, #ddc99c 100%);
  font-family: 'Noto Serif SC', serif;
  transition: opacity 1.1s ease, visibility 0s linear 1.15s;
  overflow: hidden;
  cursor: pointer;
}
.splash-inner {
  display: flex; flex-direction: column; align-items: center;
  position: relative; z-index: 2;
}
.splash svg {
  width: 92px; height: 92px;
  filter: drop-shadow(0 6px 16px rgba(168,50,74,0.18));
  animation: splashBloom 1.6s cubic-bezier(.2,.8,.25,1) both,
             splashBreath 4s ease-in-out 1.6s infinite;
}
.splash-title {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 44px;
  color: #1a1612;
  letter-spacing: 0.14em;
  margin-top: 20px;
  opacity: 0;
  animation: splashRise 1.1s ease-out 0.9s forwards;
}
.splash-rule {
  width: 0; height: 1px; margin-top: 14px;
  background: linear-gradient(90deg, transparent, #c79a3a 45%, #c79a3a 55%, transparent);
  animation: splashRule 1.2s ease-out 1.6s forwards;
}
.splash-tagline {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 14px;
  color: #a8324a;
  letter-spacing: 0.36em;
  margin-top: 14px;
  opacity: 0;
  animation: splashRise 1.1s ease-out 1.4s forwards;
}
.splash-poem {
  margin-top: 22px;
  font-size: 13px;
  color: #7a6a4a;
  letter-spacing: 0.5em;
  text-indent: 0.5em;
  opacity: 0;
  animation: splashFadeIn 1.4s ease-out 2.2s forwards;
}
.splash-enter {
  position: absolute;
  bottom: 40px;
  font-size: 11px;
  color: #8a7654;
  letter-spacing: 0.4em;
  text-indent: 0.4em;
  opacity: 0;
  animation: splashFadeHint 1.2s ease-out 3.2s forwards;
}
.splash-petal {
  position: absolute;
  top: -8%;
  width: 11px; height: 13px;
  background: #c8556e;
  border-radius: 0 72% 0 72%;
  opacity: 0;
  z-index: 1;
}
.splash-petal:nth-child(1) { left: 18%; animation: splashDrift 6s linear 0.4s infinite; }
.splash-petal:nth-child(2) { left: 38%; width: 9px; height: 11px; background: #d98aa0; animation: splashDrift 7.5s linear 1.6s infinite; }
.splash-petal:nth-child(3) { left: 64%; animation: splashDrift 6.8s linear 0.9s infinite; }
.splash-petal:nth-child(4) { left: 82%; width: 8px; height: 10px; background: #e0a7b8; animation: splashDrift 8s linear 2.3s infinite; }
body.app-ready .splash {
  opacity: 0;
  visibility: hidden;
}
@keyframes splashBloom {
  0%   { transform: scale(0.5) rotate(-30deg); opacity: 0; }
  60%  { opacity: 1; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}
@keyframes splashBreath {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
@keyframes splashRise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes splashRule { to { width: 140px; } }
@keyframes splashFadeIn { to { opacity: 0.9; } }
@keyframes splashFadeHint { to { opacity: 0.6; } }
@keyframes splashDrift {
  0%   { transform: translateY(0) rotate(0); opacity: 0; }
  10%  { opacity: 0.7; }
  90%  { opacity: 0.7; }
  100% { transform: translateY(108vh) rotate(320deg); opacity: 0; }
}

:root {
  --ink: #1a1612;
  --ink-soft: #3d2f24;
  --paper: #f5ecdb;
  --paper-warm: #ede0c2;
  --paper-deep: #ddc99c;
  --crimson: #a8324a;
  --crimson-deep: #7a1f33;
  --jade: #5a7a4a;
  --gold: #b8893a;
  --gold-light: #d4a85a;
  --province-fill: #f0e5cc;
  --province-stroke: #8a7654;
  --province-hover: #e5d5b0;
  --shadow: rgba(40, 25, 15, 0.15);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Noto Serif SC', serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(circle at 15% 25%, rgba(184,137,58,0.08) 0%, transparent 50%),
    radial-gradient(circle at 85% 75%, rgba(168,50,74,0.05) 0%, transparent 50%);
  pointer-events: none;
  z-index: 1;
}

.page {
  position: relative;
  z-index: 2;
  max-width: 1500px;
  margin: 0 auto;
  padding: 36px 28px 50px;
}

header {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: end;
  gap: 32px;
  margin-bottom: 28px;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 22px;
  position: relative;
}

header::after {
  content: '';
  position: absolute;
  bottom: -6px; left: 0; right: 0;
  height: 1px;
  background: var(--ink);
}

.title-block {
  display: flex;
  align-items: baseline;
  gap: 18px;
}

.title-cn {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 58px;
  color: var(--ink);
  letter-spacing: 0.05em;
  line-height: 1;
}

.title-en {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 19px;
  color: var(--crimson);
  letter-spacing: 0.18em;
}

.tagline {
  font-family: 'ZCOOL XiaoWei', serif;
  font-size: 14px;
  color: #6b5a45;
  letter-spacing: 0.35em;
  text-align: center;
}

.seal {
  width: 70px; height: 70px;
  background: var(--crimson);
  color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Ma Shan Zheng', serif;
  font-size: 26px;
  border-radius: 4px;
  transform: rotate(-3deg);
  box-shadow: 3px 3px 0 rgba(122,31,51,0.25);
  line-height: 1;
  position: relative;
}
.seal::before {
  content: '';
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(245,236,219,0.4);
  border-radius: 2px;
}

/* ========== 图层切换 ========== */
.layer-switch {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 12px;
  padding: 6px;
  background: linear-gradient(135deg, rgba(255, 250, 235, 0.85) 0%, rgba(240, 225, 195, 0.6) 100%);
  border: 1px solid rgba(184, 137, 58, 0.3);
  border-radius: 3px;
  position: relative;
}
.layer-btn {
  flex: 0 0 auto;
  padding: 8px 22px;
  font-family: 'Ma Shan Zheng', serif;
  font-size: 17px;
  letter-spacing: 0.2em;
  color: var(--ink-soft);
  background: transparent;
  border: none;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
}
.layer-btn:hover {
  color: var(--ink);
  background: rgba(255, 250, 235, 0.5);
}
.layer-btn.active {
  color: var(--paper);
  background: var(--crimson);
  box-shadow: 0 2px 6px rgba(168, 50, 74, 0.25);
}
.layer-switch-hint {
  margin-left: auto;
  padding-right: 14px;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  color: var(--gold);
  letter-spacing: 0.05em;
}

/* 当切到赏花点层 - 市花层变淡(作为底色) */
#map.layer-spot #cityLayer {
  opacity: 0.18;
  pointer-events: none;
  transition: opacity 0.5s;
}
#map.layer-spot #spotLayer {
  display: block !important;
}
#map.layer-city #cityLayer {
  opacity: 1;
  transition: opacity 0.5s;
}

/* 赏花点 marker 样式 */
.spot-marker {
  cursor: pointer;
  transform-box: fill-box;
  transform-origin: center;
  filter: drop-shadow(0 1px 2px rgba(90, 40, 20, 0.25));
}
.spot-marker:hover .spot-flower {
  filter: drop-shadow(0 0 8px rgba(255, 220, 120, 0.85)) drop-shadow(0 0 4px rgba(168, 50, 74, 0.4));
}
.spot-marker.selected .spot-flower {
  filter: drop-shadow(0 0 10px rgba(168, 50, 74, 0.7));
}
/* 月份不应季的赏花点变淡 */
.spot-marker.off-season {
  opacity: 0.32;
  transition: opacity 0.5s;
}
.spot-marker.on-season {
  opacity: 1;
  transition: opacity 0.5s;
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 0 0 14px;
  padding: 12px 18px;
  background: linear-gradient(135deg, rgba(255,250,235,0.7) 0%, rgba(240,225,195,0.5) 100%);
  border: 1px solid rgba(184, 137, 58, 0.25);
  border-radius: 4px;
  position: relative;
  z-index: 50;
}

.today-card {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 0 0 auto;
  cursor: pointer;
  transition: transform 0.2s;
}
.today-card:hover {
  transform: translateY(-1px);
}

.today-label {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 18px;
  color: var(--crimson);
  letter-spacing: 0.15em;
  padding: 3px 12px;
  border: 1px solid var(--crimson);
  border-radius: 2px;
  background: rgba(255, 250, 235, 0.6);
}

.today-content {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.today-flower-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
}

.today-city {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 12px;
  color: var(--gold);
  letter-spacing: 0.1em;
}

.toolbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  justify-content: flex-end;
  position: relative;
}

.search-wrap {
  position: relative;
  width: 220px;
}

.search-input {
  width: 100%;
  padding: 8px 14px;
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  color: var(--ink);
  background: rgba(255, 252, 240, 0.85);
  border: 1px solid rgba(138, 118, 84, 0.4);
  border-radius: 2px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-input:focus {
  border-color: var(--crimson);
  box-shadow: 0 0 0 2px rgba(168, 50, 74, 0.12);
}

  font-size: 12px;
}

.search-results {
  position: absolute;
  top: calc(100% + 4px);

  background: var(--paper);
  border: 1px solid rgba(138, 118, 84, 0.4);
  border-radius: 2px;
  max-height: 280px;

  box-shadow: 0 4px 16px rgba(40, 25, 15, 0.18);
}
.search-results.show { display: block; }
.search-result-item {
  padding: 8px 14px;
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;

  border-bottom: 1px solid rgba(184, 137, 58, 0.15);
  transition: background 0.15s;
}
.search-result-item:hover {
  background: rgba(232, 168, 48, 0.12);
}
.search-result-item .result-flower {
  color: var(--crimson);

  margin-left: 8px;
  font-family: 'Cormorant Garamond', serif;

.search-result-empty {

.tool-btn {

  font-size: 13px;

  background: rgba(255, 252, 240, 0.85);
  border: 1px solid rgba(138, 118, 84, 0.4);
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.2s;

}
.tool-btn:hover {
  background: var(--gold-light);
  border-color: var(--gold);
  color: var(--paper);
}

  background: var(--crimson);
  color: var(--paper);
  border-color: var(--crimson);
}

.filter-panel {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;

  border: 1px solid rgba(138, 118, 84, 0.4);
  border-radius: 2px;
  padding: 14px;
  display: none;
  z-index: 100;
  box-shadow: 0 4px 16px rgba(40, 25, 15, 0.18);
}
.filter-panel.show { display: block; }
.filter-panel-title {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 14px;

.filter-tags {

.filter-tag {

.filter-tag:hover {

}

.month-btn .num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px;
  font-style: italic;
  display: block;
  opacity: 0.55;
  margin-bottom: 3px;
}
.month-btn.active .num { opacity: 0.75; }

.main {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 28px;
  align-items: start;
}

.map-frame {
  position: relative;
  --season-base-1: #faf3e4;
  --season-base-2: #f0e3c8;
  --season-base-3: #e8d9bb;
  --season-tint-1: 220, 195, 158;
  --season-tint-2: 232, 210, 175;
  --season-tint-3: 218, 188, 145;
  background:
    /* 多个不规则的水彩晕染色块 */
    radial-gradient(ellipse 60% 50% at 20% 30%, rgba(var(--season-tint-1), 0.45) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 20%, rgba(var(--season-tint-2), 0.5) 0%, transparent 65%),
    radial-gradient(ellipse 55% 45% at 70% 75%, rgba(var(--season-tint-3), 0.4) 0%, transparent 60%),
    radial-gradient(ellipse 45% 35% at 25% 85%, rgba(var(--season-tint-2), 0.5) 0%, transparent 65%),
    radial-gradient(ellipse 40% 30% at 50% 50%, rgba(var(--season-tint-1), 0.3) 0%, transparent 70%),
    radial-gradient(circle at 15% 60%, rgba(var(--season-tint-3), 0.18) 0%, transparent 35%),
    radial-gradient(circle at 85% 50%, rgba(var(--season-tint-1), 0.2) 0%, transparent 40%),
    /* 底色基调 */
    linear-gradient(135deg, var(--season-base-1) 0%, var(--season-base-2) 50%, var(--season-base-3) 100%);
  border: 1px solid #b3a380;
  padding: 24px;
  box-shadow: 0 6px 24px var(--shadow);
  overflow: hidden;
  transition: --season-base-1 1.2s, --season-base-2 1.2s, --season-base-3 1.2s;
}

/* 季节配色:春(粉绿) */
.map-frame[data-season="spring"] {
  --season-base-1: #f5f0e0;
  --season-base-2: #e8e8d2;
  --season-base-3: #d8e0c8;
  --season-tint-1: 200, 220, 180;
  --season-tint-2: 230, 210, 195;
  --season-tint-3: 195, 215, 175;
}
/* 季节配色:夏(浓烈青翠) */
.map-frame[data-season="summer"] {
  --season-base-1: #f0ecda;
  --season-base-2: #e0e2c5;
  --season-base-3: #d0dab2;
  --season-tint-1: 175, 200, 145;
  --season-tint-2: 220, 200, 145;
  --season-tint-3: 165, 185, 130;
}
/* 季节配色:秋(金黄) */
.map-frame[data-season="autumn"] {
  --season-base-1: #f7ecce;
  --season-base-2: #f0dca8;
  --season-base-3: #e5c585;
  --season-tint-1: 220, 175, 95;
  --season-tint-2: 235, 200, 130;
  --season-tint-3: 200, 150, 75;
}
/* 季节配色:冬(雪白) */
.map-frame[data-season="winter"] {
  --season-base-1: #f6f3ec;
  --season-base-2: #ebe8e0;
  --season-base-3: #ddd8cc;
  --season-tint-1: 210, 215, 220;
  --season-tint-2: 225, 220, 215;
  --season-tint-3: 195, 200, 205;
}

/* 水彩纸张纤维质感叠加层 */
.map-frame::before {
  content: '中华花图';
  position: absolute;
  top: 16px; left: 24px;
  font-family: 'Ma Shan Zheng', serif;
  font-size: 15px;
  color: #a89578;
  letter-spacing: 0.45em;
  z-index: 5;
  pointer-events: none;
}

/* 纸张纤维：细密颗粒纹理 (由 JS 动态生成) */
.paper-texture {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 1;
  mix-blend-mode: multiply;
  background-repeat: repeat;
  background-size: 300px 300px;
}

/* 水彩晕染：大色块斑驳 */
.paper-texture-watercolor {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  opacity: 0.6;
  mix-blend-mode: overlay;
  background-repeat: repeat;
  background-size: 700px 700px;
}

.map-frame::after {
  content: 'FLORAL ATLAS · MMXXVI';
  position: absolute;
  bottom: 16px; right: 24px;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 11px;
  color: #a89578;
  letter-spacing: 0.3em;
  z-index: 5;
  pointer-events: none;
}

.corner {
  position: absolute;
  width: 28px; height: 28px;
  border: 1.5px solid var(--ink-soft);
  z-index: 5;
  pointer-events: none;
}
.corner.tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
.corner.tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
.corner.bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
.corner.br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

.zoom-controls {
  position: absolute;
  top: 16px;
  right: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  background: rgba(255, 250, 235, 0.92);
  border: 1px solid rgba(138, 118, 84, 0.4);
  border-radius: 4px;
  padding: 4px;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(40, 25, 15, 0.12);
}
.zoom-btn {
  width: 32px;
  height: 32px;
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
  background: transparent;
  border: none;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.zoom-btn:hover {
  background: var(--gold-light);
  color: var(--paper);
}
.zoom-btn.zoom-reset {
  font-size: 16px;
  border-top: 1px solid rgba(138, 118, 84, 0.25);
  margin-top: 2px;
  padding-top: 2px;
  width: 100%;
}
.zoom-indicator {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 11px;
  color: var(--ink-soft);
  padding: 2px 0;
  border-top: 1px solid rgba(138, 118, 84, 0.25);
  border-bottom: 1px solid rgba(138, 118, 84, 0.25);
  width: 100%;
  text-align: center;
  letter-spacing: 0.05em;
}

.zoom-scroll-hint {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  padding: 6px 14px;
  font-family: 'Noto Serif SC', serif;
  font-size: 12px;
  color: var(--paper);
  background: rgba(40, 25, 15, 0.78);
  border-radius: 3px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s, transform 0.3s;
  z-index: 10;
  letter-spacing: 0.05em;
}
.zoom-scroll-hint.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

svg.map {
  width: 100%;
  height: auto;
  display: block;
  position: relative;
  z-index: 3;
}

.province {
  fill: var(--province-fill);
  stroke: var(--province-stroke);
  stroke-width: 0.4;
  stroke-linejoin: round;
  transition: fill 0.4s ease;
}

.province.has-bloom {
  fill: #ead8b3;
}

.city-dot {
  cursor: pointer;
}

.city-dot circle.hitarea {
  pointer-events: all;
  /* 透明但可点击的大圆，扩大点击热区 */
}

.city-dot circle.base {
  fill: var(--ink-soft);
  stroke: var(--paper);
  stroke-width: 0.5;
  transition: all 0.3s ease;
  pointer-events: none;
}

.city-dot.blooming circle.base {
  display: none;
}

.city-dot.selected circle.base {
  fill: var(--gold);
  r: 3;
}

.city-dot:hover circle.base {
  fill: var(--crimson-deep);
}

.city-label-group {
  cursor: pointer;
}

.city-label-group .label-hitarea {
  pointer-events: all;
}

.city-label {
  font-family: 'Noto Serif SC', serif;
  font-size: 12px;
  font-weight: 600;
  fill: var(--ink);
  paint-order: stroke;
  stroke: var(--paper);
  stroke-width: 3.5;
  stroke-linejoin: round;
  pointer-events: none;
  transition: fill 0.25s, font-size 0.25s;
}

.city-label-group:hover .city-label {
  fill: var(--crimson);
}

.city-label.bloom { fill: var(--crimson-deep); stroke: var(--paper); stroke-width: 3.5; }
.city-label.selected { 
  fill: var(--crimson); 
  font-weight: 800; 
  font-size: 14px;
  stroke: var(--paper-deep); 
  stroke-width: 4;
}

.flower-group {
  opacity: 0;
  transform-origin: center;
  transform-box: fill-box;
  pointer-events: none;
  filter: drop-shadow(0 1px 2px rgba(90, 40, 20, 0.2));
}
.flower-group.open {
  opacity: 1;
  animation: bloomAnim 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
.flower-group.wilting {
  animation: wiltAnim 0.7s ease-in forwards;
}

.scatter-flower {
  opacity: 0.55;
  pointer-events: none;
  filter: drop-shadow(0 1px 1.5px rgba(90, 40, 20, 0.12));
  transition: opacity 0.6s ease;
  transform-box: fill-box;
  transform-origin: 50% 100%;
}
.city-dot.blooming .scatter-flower {
  opacity: 0.95;
  animation: scatterBloom 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
.city-dot:hover .scatter-flower {
  opacity: 1;
  /* 悬停时小花轻轻摇曳 */
  animation: flowerSway 2.4s ease-in-out infinite;
  animation-delay: var(--sway-delay, 0s);
}
@keyframes scatterBloom {
  0% { opacity: 0.4; transform: scale(0.6); }
  100% { opacity: 0.95; transform: scale(1); }
}
@keyframes flowerSway {
  0%, 100% { transform: rotate(-2deg) translateY(0); }
  25% { transform: rotate(2deg) translateY(-1px); }
  50% { transform: rotate(-1deg) translateY(0); }
  75% { transform: rotate(2.5deg) translateY(-0.5px); }
}

/* 主花放大 */
.city-dot:hover .flower-group.open .map-flower-img,
.city-dot:hover .flower-group .map-flower-img {
  animation: mainFlowerBreath 1.8s ease-in-out infinite;
}
@keyframes mainFlowerBreath {
  0%, 100% { transform: scale(1.05); }
  50% { transform: scale(1.18); }
}

/* 诗句 tooltip - 浮现在城市旁边 */
.poem-tooltip {
  position: absolute;
  pointer-events: none;
  background: linear-gradient(135deg, rgba(255, 252, 242, 0.97), rgba(245, 230, 200, 0.96));
  border: 1px solid rgba(168, 50, 74, 0.25);
  border-radius: 3px;
  padding: 8px 14px 10px;
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  color: var(--ink);
  box-shadow: 0 4px 16px rgba(40, 25, 15, 0.18);
  z-index: 200;
  max-width: 220px;
  white-space: nowrap;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.25s, transform 0.25s;
}
.poem-tooltip.show {
  opacity: 1;
  transform: translateY(0);
}
.poem-tooltip .poem-flower-name {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 14px;
  color: var(--crimson);
  letter-spacing: 0.15em;
  margin-bottom: 4px;
}
.poem-tooltip .poem-line {
  font-size: 12px;
  color: var(--ink-soft);
  font-style: italic;
}
.poem-tooltip::before {
  content: '';
  position: absolute;
  left: 50%;
  top: -5px;
  margin-left: -5px;
  width: 10px; height: 10px;
  background: linear-gradient(135deg, rgba(255, 252, 242, 0.97), rgba(245, 230, 200, 0.96));
  border-left: 1px solid rgba(168, 50, 74, 0.25);
  border-top: 1px solid rgba(168, 50, 74, 0.25);
  transform: rotate(45deg);
}
@keyframes bloomAnim {
  0% { transform: scale(0) rotate(-25deg); opacity: 0; }
  60% { transform: scale(1.15) rotate(4deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}
@keyframes wiltAnim {
  0% { transform: scale(1) rotate(0); opacity: 1; filter: drop-shadow(0 1px 2px rgba(90, 40, 20, 0.2)); }
  40% { transform: scale(0.85) rotate(8deg); opacity: 0.6; filter: drop-shadow(0 1px 2px rgba(90, 40, 20, 0.1)) saturate(0.5) brightness(0.9); }
  100% { transform: scale(0.3) rotate(35deg) translateY(15px); opacity: 0; filter: saturate(0) brightness(0.8); }
}

.sidebar {
  position: sticky;
  top: 20px;
  background: var(--paper);
  border: 1px solid #b3a380;
  box-shadow: 0 6px 24px var(--shadow);
  overflow: hidden;
  max-height: calc(100vh - 40px);
  display: flex;
  flex-direction: column;
}

.sidebar-head {
  padding: 22px 26px 14px;
  background: var(--paper-warm);
  border-bottom: 1px solid #c9b896;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}
.sidebar-head.messenger-arrived::after {
  content: '';
  position: absolute;
  top: 0;
  left: -30%;
  width: 30%;
  height: 100%;
  background: linear-gradient(90deg, transparent 0%, rgba(255, 220, 150, 0.4) 50%, transparent 100%);
  animation: messengerSweep 1.4s ease-out;
  pointer-events: none;
}
@keyframes messengerSweep {
  0% { left: -30%; }
  100% { left: 130%; }
}

.sidebar-head .label {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 22px;
  letter-spacing: 0.25em;
}
.sidebar-head .num {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  color: var(--crimson);
  letter-spacing: 0.15em;
}

.sidebar-body {
  padding: 24px 26px 30px;
  overflow-y: auto;
  flex: 1;
}

.month-info {
  text-align: center;
  margin-bottom: 22px;
  padding: 14px 16px;
  background: linear-gradient(to right, rgba(168,50,74,0.05), rgba(168,50,74,0.02));
  border-left: 3px solid var(--crimson);
}
.month-info .label {
  font-size: 11px;
  color: #8a7654;
  letter-spacing: 0.35em;
  margin-bottom: 4px;
}
.month-info .value {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 28px;
  color: var(--ink);
  line-height: 1.2;
}
.month-info .count {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  color: var(--crimson);
  margin-top: 4px;
  letter-spacing: 0.1em;
}

.empty-state {
  text-align: center;
  color: #8a7654;
  padding: 60px 20px 40px;
  font-size: 14px;
  line-height: 2;
}
.empty-state .icon {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 48px;
  color: var(--paper-deep);
  margin-bottom: 12px;
}

.info-card {
  animation: fadeIn 0.5s ease;
  position: relative;
}

/* ========== 赏花点详情卡 ========== */
.spot-card {
  animation: fadeIn 0.5s ease;
  position: relative;
}
.spot-card-tag {
  display: inline-block;
  padding: 3px 10px;
  font-family: 'Noto Serif SC', serif;
  font-size: 11px;
  color: var(--paper);
  background: var(--crimson);
  border-radius: 2px;
  letter-spacing: 0.1em;
  margin-bottom: 12px;
}
.spot-name {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 30px;
  color: var(--ink);
  line-height: 1.2;
  margin-bottom: 8px;
  letter-spacing: 0.04em;
}
.spot-flower-line {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.spot-flower-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  color: var(--crimson);
  font-weight: 500;
}
.spot-best-time {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 12px;
}
.spot-best-time.on { background: var(--crimson); color: var(--paper); }
.spot-best-time.off { background: var(--paper-deep); color: var(--ink-soft); }

.spot-scene-wrap {
  position: relative;
  margin-bottom: 16px;
  border: 1px solid rgba(138, 118, 84, 0.3);
  border-radius: 3px;
  overflow: hidden;
  box-shadow: 0 3px 12px rgba(40, 25, 15, 0.12);
  background: #f0e8d8;
}
.spot-scene-wrap .spot-scene-canvas {
  display: block;
  width: 100%;
  height: auto;
  transition: opacity 0.45s ease;
}
.spot-scene-wrap .spot-scene-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.45s ease;
  pointer-events: none;
}
.spot-scene-wrap.show-photo .spot-scene-canvas {
  opacity: 0;
}
.spot-scene-wrap.show-photo .spot-scene-photo.loaded {
  opacity: 1;
}
.spot-scene-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  color: var(--ink-soft);
  background: rgba(245, 235, 215, 0.92);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  letter-spacing: 0.1em;
}
.spot-scene-wrap.show-photo .spot-scene-loading.show {
  opacity: 1;
}
.spot-scene-wrap.show-photo .spot-scene-photo.loaded ~ .spot-scene-loading {
  opacity: 0;
}

/* 切换按钮 — 浮在右上角 */
.spot-scene-toggle {
  position: absolute;
  top: 10px;
  right: 10px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px;
  font-family: 'Noto Serif SC', serif;
  font-size: 12px;
  color: var(--ink);
  background: rgba(255, 250, 235, 0.92);
  border: 1px solid rgba(138, 118, 84, 0.5);
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 2px 4px rgba(40, 25, 15, 0.15);
  letter-spacing: 0.08em;
  z-index: 5;
}
.spot-scene-toggle:hover {
  background: var(--crimson);
  color: var(--paper);
  border-color: var(--crimson);
}
.spot-scene-toggle .toggle-icon {
  font-size: 13px;
  filter: grayscale(0.3);
}

/* 自定义图片上传按钮 - 浮在实景按钮旁边 */
.spot-scene-upload {
  position: absolute;
  top: 10px;
  right: 78px;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  font-size: 13px;
  color: var(--ink);
  background: rgba(255, 250, 235, 0.92);
  border: 1px solid rgba(138, 118, 84, 0.5);
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 2px 4px rgba(40, 25, 15, 0.15);
  z-index: 5;
  user-select: none;
}
.spot-scene-upload:hover {
  background: var(--gold-light);
  border-color: var(--gold);
}
.spot-scene-upload.has-custom {
  background: var(--gold);
  border-color: var(--gold);
}
.spot-scene-upload.has-custom::after {
  content: '';
  position: absolute;
  top: 3px; right: 3px;
  width: 6px; height: 6px;
  background: var(--crimson);
  border-radius: 50%;
}
.spot-scene-upload.is-embedded {
  background: var(--crimson);
  border-color: var(--crimson);
  color: var(--paper);
}
.spot-scene-upload.is-embedded::after {
  background: var(--gold);
}

/* 导出按钮 */
.spot-scene-export {
  position: absolute;
  top: 10px;
  right: 114px;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  font-size: 13px;
  color: var(--ink);
  background: rgba(255, 250, 235, 0.92);
  border: 1px solid rgba(138, 118, 84, 0.5);
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 2px 4px rgba(40, 25, 15, 0.15);
  z-index: 5;
}
.spot-scene-export:hover {
  background: var(--crimson);
  color: var(--paper);
  border-color: var(--crimson);
}

/* 导出对话框 */
.export-dialog-overlay {
  position: fixed;
  inset: 0;
  background: rgba(40, 25, 15, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  animation: fadeIn 0.2s ease;
}
.export-dialog {
  width: 560px;
  max-width: 90vw;
  max-height: 90vh;
  overflow-y: auto;
  background: var(--paper);
  border: 1px solid var(--ink-soft);
  border-radius: 3px;
  box-shadow: 0 10px 40px rgba(40, 25, 15, 0.35);
  font-family: 'Noto Serif SC', serif;
}
.export-dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 22px;
  background: var(--paper-warm);
  border-bottom: 1px solid #c9b896;
}
.export-dialog-title {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 18px;
  letter-spacing: 0.1em;
  color: var(--ink);
}
.export-dialog-close {
  background: none;
  border: none;
  font-size: 24px;
  color: var(--ink-soft);

  line-height: 1;

}
.export-dialog-close:hover {
  color: var(--crimson);
}
.export-dialog-body {
  padding: 18px 22px 22px;
}
.export-step {
  margin: 14px 0 6px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--ink);
}
.export-step:first-child {
  margin-top: 0;
}
.export-step strong {
  color: var(--crimson);
  font-weight: 600;
  margin-right: 4px;
}
.export-textarea {
  width: 100%;
  height: 80px;
  margin: 6px 0 10px;
  padding: 10px;
  font-family: 'Menlo', 'Monaco', monospace;
  font-size: 11px;
  line-height: 1.4;
  color: var(--ink-soft);
  background: #faf5e8;
  border: 1px solid #c9b896;
  border-radius: 2px;
  resize: vertical;
  white-space: pre;
  overflow: auto;
}
.export-copy-btn {
  display: block;
  width: 100%;
  padding: 10px 16px;
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: var(--paper);
  background: var(--crimson);
  border: none;
  border-radius: 2px;
  cursor: pointer;
  letter-spacing: 0.1em;
  transition: all 0.2s;
  margin-bottom: 6px;
}
.export-copy-btn:hover {
  background: var(--crimson-deep);
}
.export-copy-btn.copied {
  background: #4a7c5a;
}
.export-marker {
  margin: 6px 0;
  padding: 8px 12px;
  font-family: 'Menlo', 'Monaco', monospace;
  font-size: 11px;
  color: var(--gold);
  background: #2a2218;
  border-radius: 2px;
  overflow-x: auto;
}
.export-note {
  margin-top: 18px;
  padding: 10px 14px;
  font-size: 12.5px;
  color: var(--ink-soft);
  background: rgba(255, 220, 150, 0.25);
  border-left: 3px solid var(--gold);
  border-radius: 2px;
  line-height: 1.65;
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.spot-scene-wrap.show-photo .spot-poetic {
  color: rgba(255, 252, 240, 0.95);
  text-shadow: 0 1px 3px rgba(0,0,0,0.7), 0 0 10px rgba(0,0,0,0.5);
}
.spot-poetic {
  position: absolute;
  bottom: 10px;
  left: 14px;
  right: 14px;
  font-family: 'Ma Shan Zheng', serif;
  font-size: 17px;
  color: rgba(60, 35, 25, 0.85);
  letter-spacing: 0.18em;
  text-shadow: 0 1px 2px rgba(255, 250, 235, 0.85), 0 0 8px rgba(255, 250, 235, 0.6);
  text-align: center;
  pointer-events: none;
}

.spot-best-period {
  background: linear-gradient(135deg, rgba(255, 248, 225, 0.8), rgba(245, 225, 185, 0.6));
  border-left: 3px solid var(--crimson);
  padding: 12px 16px;
  margin-bottom: 16px;
  border-radius: 2px;
}
.period-label {
  font-family: 'Noto Serif SC', serif;
  font-size: 11px;
  color: var(--ink-soft);
  letter-spacing: 0.15em;
  margin-bottom: 4px;
}
.period-value {
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  color: var(--crimson);
  font-weight: 600;
  margin-bottom: 4px;
}
.period-months {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 12px;
  color: var(--gold);
  letter-spacing: 0.05em;
}

.spot-notes {
  font-family: 'Noto Serif SC', serif;
  font-size: 13.5px;
  line-height: 1.85;
  color: var(--ink-soft);
  margin-bottom: 18px;
  padding: 10px 0;
  border-top: 1px dashed rgba(168, 50, 74, 0.2);
  border-bottom: 1px dashed rgba(168, 50, 74, 0.2);
}

.spot-info-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.info-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 6px 0;
}
.info-icon {
  font-size: 16px;
  flex: 0 0 auto;
  width: 24px;
  text-align: center;
  filter: grayscale(0.4);
}
.info-row > div {
  flex: 1;
  min-width: 0;
}
.info-label {
  font-family: 'Noto Serif SC', serif;
  font-size: 11px;
  color: var(--ink-soft);
  letter-spacing: 0.12em;
  margin-bottom: 2px;
}
.info-value {
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  color: var(--ink);
  line-height: 1.5;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.share-btn {
  position: absolute;
  top: 0;
  right: 0;
  padding: 6px 12px;
  font-family: 'Noto Serif SC', serif;
  font-size: 12px;
  color: var(--ink-soft);
  background: rgba(255, 250, 235, 0.85);
  border: 1px solid rgba(138, 118, 84, 0.4);
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.2s;
  z-index: 5;
}
.share-btn:hover {
  background: var(--crimson);
  color: var(--paper);
  border-color: var(--crimson);
}

.city-name {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 42px;
  line-height: 1;
  margin-bottom: 6px;
}

.city-pinyin {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 15px;
  color: var(--gold);
  letter-spacing: 0.25em;
  margin-bottom: 4px;
}

.city-province {
  font-size: 12px;
  color: #8a7654;
  letter-spacing: 0.3em;
  margin-bottom: 18px;
}

.flower-block {
  border-top: 1px dashed #c9b896;
  padding-top: 18px;
  margin-top: 18px;
}
.flower-block:first-of-type { border-top: 2px solid var(--ink); padding-top: 18px; }

/* 花朵展示容器：圆形装饰画框 */
.flower-illust {
  position: relative;
  width: 100%;
  height: 200px;
  margin: 14px 0 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 圆形装饰背景 */
.flower-illust::before {
  content: '';
  position: absolute;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: 
    radial-gradient(circle at 35% 25%, rgba(255, 250, 235, 0.9) 0%, rgba(244, 233, 210, 0.85) 30%, rgba(232, 218, 185, 0.7) 70%, rgba(208, 188, 145, 0.3) 100%);
  box-shadow:
    inset 0 0 30px rgba(184, 137, 58, 0.18),
    inset 0 0 8px rgba(122, 31, 51, 0.08),
    0 4px 12px rgba(40, 25, 15, 0.18);
  z-index: 0;
}

/* 圆形细线装饰边框 */
.flower-illust::after {
  content: '';
  position: absolute;
  width: 168px;
  height: 168px;
  border-radius: 50%;
  border: 1px dashed rgba(184, 137, 58, 0.45);
  z-index: 1;
  pointer-events: none;
}

/* 水彩画占位（默认显示） */
.flower-watercolor {
  position: absolute;
  width: 200px;
  height: 200px;
  z-index: 2;
  filter: drop-shadow(0 3px 5px rgba(90, 40, 20, 0.25));
  transition: opacity 0.5s ease;
}

/* 真照片层（默认隐藏，切换到 photo 模式才显示） */
.flower-photo {
  position: absolute;
  width: 170px;
  height: 170px;
  object-fit: cover;
  border-radius: 50%;
  z-index: 3;
  opacity: 0;
  transition: opacity 0.5s ease;
  box-shadow:
    inset 0 0 30px rgba(40, 25, 15, 0.2),
    0 3px 8px rgba(40, 25, 15, 0.2);
  pointer-events: none;
}

/* data-mode="photo" 状态:照片可见,水彩隐藏 */
.flower-illust[data-mode="photo"] .flower-watercolor {
  opacity: 0;
}
.flower-illust[data-mode="photo"] .flower-photo.loaded {
  opacity: 1;
}

/* 照片加载提示 */
.flower-photo-loading {
  position: absolute;
  width: 170px;
  height: 170px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif SC', serif;
  font-size: 12px;
  color: var(--ink-soft);
  background: rgba(245, 235, 215, 0.85);
  opacity: 0;
  pointer-events: none;
  z-index: 4;
  letter-spacing: 0.1em;
  transition: opacity 0.3s;
}
.flower-illust[data-mode="photo"] .flower-photo-loading.show {
  opacity: 1;
}

/* 切换按钮 - 跟赏花点同款 */
.flower-toggle {
  position: absolute;
  top: 8px;
  right: 12px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px;
  font-family: 'Noto Serif SC', serif;
  font-size: 12px;
  color: var(--ink);
  background: rgba(255, 250, 235, 0.92);
  border: 1px solid rgba(138, 118, 84, 0.5);
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 2px 4px rgba(40, 25, 15, 0.15);
  letter-spacing: 0.08em;
  z-index: 10;
}
.flower-toggle:hover {
  background: var(--crimson);
  color: var(--paper);
  border-color: var(--crimson);
}
.flower-toggle[data-mode="photo"] {
  background: var(--crimson);
  color: var(--paper);
  border-color: var(--crimson);
}
.flower-toggle .toggle-icon {
  font-size: 13px;
  filter: grayscale(0.3);
}

/* 花朵卡片：印章 */
.flower-illust .seal-mark {
  position: absolute;
  bottom: 10px;
  right: 20px;
  width: 28px;
  height: 28px;
  background: var(--crimson);
  color: var(--paper);
  font-family: 'Ma Shan Zheng', serif;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
  z-index: 3;
  transform: rotate(-5deg);
  box-shadow: 1px 1px 0 rgba(122, 31, 51, 0.3);
  opacity: 0.9;
}

.flower-name {
  font-family: 'Ma Shan Zheng', 'ZCOOL XiaoWei', serif;
  font-weight: 400;
  font-size: 32px;
  color: var(--crimson);
  letter-spacing: 0.08em;
  margin-bottom: 4px;
  text-align: center;
  line-height: 1.1;
}

.flower-latin {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 14px;
  color: #8a7654;
  margin-bottom: 16px;
  letter-spacing: 0.1em;
  text-align: center;
}

.meta-grid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px 16px;
  font-size: 13px;
  margin-bottom: 14px;
}
.meta-grid dt {
  color: #8a7654;
  letter-spacing: 0.2em;
  font-size: 12px;
  white-space: nowrap;
}
.meta-grid dd { color: var(--ink); }

.bloom-now {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 500;
}
.bloom-now.yes { background: var(--crimson); color: var(--paper); }
.bloom-now.no { background: var(--paper-deep); color: var(--ink-soft); }

/* 当下盛放 + 花期月份 一行展示 */
.bloom-status-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 14px 0 16px;
  padding: 10px 14px;
  background: rgba(255, 250, 235, 0.55);
  border: 1px dashed rgba(184, 137, 58, 0.35);
  border-radius: 3px;
  flex-wrap: wrap;
}
.bloom-months-brief {
  font-family: 'Noto Serif SC', serif;
  font-size: 12px;
  color: var(--ink-soft);
  letter-spacing: 0.05em;
}

/* 「知更多」展开器 */
.flower-details {
  margin-top: 14px;
  border-top: 1px dashed #c9b896;
  padding-top: 12px;
}
.flower-details > summary {
  cursor: pointer;
  font-family: 'Ma Shan Zheng', serif;
  font-size: 14px;
  color: var(--crimson);
  letter-spacing: 0.25em;
  padding: 6px 0;
  list-style: none;
  outline: none;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: color 0.2s;
}
.flower-details > summary::-webkit-details-marker { display: none; }
.flower-details > summary::before {
  content: '▸';
  font-size: 10px;
  color: var(--gold);
  transition: transform 0.25s;
  display: inline-block;
}
.flower-details[open] > summary::before {
  transform: rotate(90deg);
}
.flower-details > summary::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(168, 50, 74, 0.3), transparent);
}
.flower-details > summary:hover {
  color: var(--gold);
}
.details-content {
  padding-top: 8px;
  animation: detailsFade 0.35s ease;
}
@keyframes detailsFade {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

.description {
  font-size: 13.5px;
  line-height: 1.85;
  color: var(--ink-soft);
  text-align: justify;
  padding-top: 12px;
  border-top: 1px dashed #c9b896;
}

.description::first-letter {
  font-family: 'Ma Shan Zheng', serif;
  font-size: 22px;
  color: var(--crimson);
  margin-right: 2px;
}

/* 花语 - 用印章式短句 */
.flower-meaning {
  margin: 4px 0 14px;
  text-align: center;
  font-size: 13px;
  color: #8a7654;
  letter-spacing: 0.2em;
  font-family: 'Noto Serif SC', serif;
}

/* 诗词卡片 */
.flower-poem {
  margin: 16px 0;
  padding: 14px 16px;
  background: linear-gradient(135deg, rgba(244, 233, 210, 0.5) 0%, rgba(232, 218, 185, 0.3) 100%);
  border-left: 3px solid var(--crimson);
  border-radius: 0 6px 6px 0;
  position: relative;
}

.flower-poem::before {
  content: '"';
  position: absolute;
  top: -6px;
  left: 6px;
  font-family: 'Ma Shan Zheng', serif;
  font-size: 38px;
  color: rgba(122, 31, 51, 0.25);
  line-height: 1;
}

.flower-poem .poem-text {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  line-height: 1.8;
  color: var(--ink);
  letter-spacing: 0.06em;
  padding-left: 16px;
}

.flower-poem .poem-author {
  font-family: 'Noto Serif SC', serif;
  font-size: 11.5px;
  color: #8a7654;
  text-align: right;
  margin-top: 6px;
  letter-spacing: 0.08em;
}

/* 用途标签 */
.flower-uses {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 10px 0;
}

.use-tag {
  font-size: 11px;
  padding: 2px 8px;
  background: rgba(184, 137, 58, 0.12);
  border: 1px solid rgba(184, 137, 58, 0.3);
  border-radius: 10px;
  color: #7a5818;
  letter-spacing: 0.08em;
}

/* 花朵附注（如"梅兰竹菊"的关联） */
.flower-notes {
  font-size: 12px;
  color: #8a7654;
  font-style: italic;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dotted rgba(184, 137, 58, 0.3);
  line-height: 1.6;
  letter-spacing: 0.04em;
}

/* 城市评定信息 */
.city-decree {
  margin-top: 6px;
  margin-bottom: 14px;
  font-size: 11.5px;
  color: #a89578;
  letter-spacing: 0.08em;
  text-align: left;
  font-style: italic;
  font-family: 'Cormorant Garamond', serif;
}

.city-decree::before {
  content: '✦ ';
  color: var(--crimson);
  font-style: normal;
}

footer {
  margin-top: 32px;
  padding-top: 18px;
  border-top: 1px solid #b3a380;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: #8a7654;
  letter-spacing: 0.18em;
  flex-wrap: wrap;
  gap: 16px;
}

.legend {
  display: flex;
  gap: 22px;
  align-items: center;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
}
.legend-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  display: inline-block;
}
.legend-dot.dormant { background: var(--ink-soft); }
.legend-dot.bloom { background: var(--crimson); }
.legend-dot.selected { background: var(--gold); }

.signature {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
}
.data-source {
  margin-top: 8px;
  font-size: 11px;
  line-height: 1.6;
  opacity: 0.72;
  max-width: 640px;
  margin-left: auto;
  margin-right: auto;
  text-align: center;
}
.data-source a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }

@media (max-width: 1000px) {
  .main { grid-template-columns: 1fr; }
  .title-cn { font-size: 42px; }
  .title-en { font-size: 15px; }
  header { grid-template-columns: 1fr auto; gap: 16px; }
  .tagline { display: none; }
  .month-btn { font-size: 12px; padding: 10px 4px; }
  .city-label { font-size: 11px; }
}

/* 手机端：底部抽屉模式 */
@media (max-width: 700px) {
  .page { padding: 10px 8px 0; }
  
  header {
    padding: 10px 4px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom-width: 2px;
  }
  
  .title-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .title-cn { font-size: 28px; letter-spacing: 0.06em; }
  .title-en { font-size: 10px; max-width: none; letter-spacing: 0.12em; }
  .seal { width: 44px; height: 44px; font-size: 14px; flex-shrink: 0; }
  
  /* 工具栏:垂直堆叠 */
  .toolbar {
    flex-direction: column;
    gap: 8px;
    padding: 8px 10px;
  }
  .today-card {
    width: 100%;
    padding: 10px 14px;
  }
  .toolbar-actions {
    width: 100%;
    gap: 6px;
  }
  .search-wrap { flex: 1; }
  .search-input { font-size: 14px; }
  .tool-btn { 
    font-size: 12px; 
    padding: 8px 10px; 
    flex-shrink: 0;
  }
  
  /* 图层切换:更紧凑 */
  .layer-switch {
    padding: 4px;
    gap: 4px;
    flex-wrap: wrap;
  }
  .layer-btn {
    padding: 8px 14px;
    font-size: 15px;
    letter-spacing: 0.12em;
  }
  .layer-switch-hint {
    width: 100%;
    margin-left: 0;
    padding: 4px 8px 2px;
    font-size: 11px;
    text-align: center;
  }
  
  /* 月份按钮变成可横向滚动 */
  .months {
    grid-template-columns: repeat(12, 52px);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 4px;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .months::-webkit-scrollbar { display: none; }
  .month-btn { 
    scroll-snap-align: center; 
    padding: 8px 4px;
  }
  
  .main {
    gap: 0;
  }
  
  /* 地图占满宽度 */
  .map-frame {
    margin: 0 -8px;
    border-radius: 0;
    min-height: 60vh;
  }
  
  /* 城市点击区域更大 */
  .city-dot circle.hitarea { r: 22; }
  .city-label { font-size: 13px; }
  
  /* 缩放按钮在移动端更小 */
  .zoom-controls {
    top: 10px;
    right: 10px;
    padding: 3px;
  }
  .zoom-btn { width: 28px; height: 28px; font-size: 16px; }
  .zoom-indicator { font-size: 10px; }
  .zoom-scroll-hint { display: none; }
  
  /* sidebar 改为底部抽屉 */
  .sidebar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    top: auto;
    max-height: 80vh;
    max-width: 100vw;
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -8px 32px rgba(40, 25, 15, 0.25);
    z-index: 1000;
    transform: translateY(calc(100% - 64px));
    transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  }
  
  /* 没内容时,抽屉只露出提示条 */
  .sidebar:not(.has-content) {
    transform: translateY(calc(100% - 44px));
  }
  
  /* 抽屉展开状态 */
  .sidebar.expanded {
    transform: translateY(0);
  }
  
  /* 抽屉把手 */
  .sidebar::before {
    content: '';
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 42px;
    height: 4px;
    border-radius: 2px;
    background: #c9b896;
    z-index: 10;
  }
  
  /* 抽屉头部成为可点击的关闭/拖拽区 */
  .sidebar-head {
    padding: 18px 22px 12px;
    cursor: pointer;
    user-select: none;

// 全新的花朵渲染 - 更精致、写实、植物插画风格
// 关键：用 SVG 渐变让花瓣有立体感，用贝塞尔曲线刻画花瓣形状

function renderFlower(type, color, scale = 1) {
  const s = scale;
  const id = `g${Math.random().toString(36).slice(2, 8)}`;

  // 用伪随机生成微扰（基于花id，保证同一花朵每次渲染一致）
  const seed = id.charCodeAt(2) + id.charCodeAt(4);
  const rand = (i, range) => {
    const v = Math.sin(seed * 9.13 + i * 13.7) * 10000;
    return (v - Math.floor(v) - 0.5) * range * 2;
  };

  // 工笔画风格渐变 + 水彩晕染滤镜
  const gradients = `
    <defs>
      <!-- 花瓣主渐变：从亮顶到暗底，更丰富的层次 -->
      <radialGradient id="${id}-p" cx="50%" cy="15%" r="90%">
        <stop offset="0%" stop-color="${shade(color, 60)}" stop-opacity="0.95"/>
        <stop offset="20%" stop-color="${shade(color, 30)}"/>
        <stop offset="55%" stop-color="${color}"/>
        <stop offset="85%" stop-color="${shade(color, -15)}"/>
        <stop offset="100%" stop-color="${shade(color, -35)}"/>
      </radialGradient>
      <!-- 花瓣深色暗面（叠加用） -->
      <radialGradient id="${id}-pd" cx="50%" cy="90%" r="80%">
        <stop offset="0%" stop-color="${shade(color, -40)}" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="${shade(color, -40)}" stop-opacity="0"/>
      </radialGradient>
      <!-- 花瓣高光（白色晕染） -->
      <radialGradient id="${id}-h" cx="35%" cy="20%" r="45%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
        <stop offset="45%" stop-color="#ffffff" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <!-- 花心金色辉光 -->
      <radialGradient id="${id}-c" cx="50%" cy="50%" r="55%">
        <stop offset="0%" stop-color="#fde88c"/>
        <stop offset="40%" stop-color="#f0c640"/>
        <stop offset="100%" stop-color="#8a5018"/>
      </radialGradient>
      <!-- 叶子渐变：从嫩绿到深绿 -->
      <linearGradient id="${id}-leaf" x1="20%" y1="0%" x2="80%" y2="100%">
        <stop offset="0%" stop-color="#8aaa54"/>
        <stop offset="55%" stop-color="#5a7a3a"/>
        <stop offset="100%" stop-color="#385828"/>
      </linearGradient>
      <linearGradient id="${id}-leafDark" x1="20%" y1="0%" x2="80%" y2="100%">
        <stop offset="0%" stop-color="#5a7a3a"/>
        <stop offset="100%" stop-color="#1a3010"/>
      </linearGradient>
      <!-- 水彩晕染滤镜（关键：让所有边缘变得有机不规则） -->
      <filter id="${id}-wash" x="-15%" y="-15%" width="130%" height="130%">
        <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="${seed}"/>
        <feDisplacementMap in="SourceGraphic" scale="${1.1*s}"/>
      </filter>
      <!-- 柔和投影 -->
      <filter id="${id}-shadow" x="-25%" y="-25%" width="150%" height="150%">
        <feGaussianBlur in="SourceAlpha" stdDeviation="${0.35*s}"/>
        <feOffset dx="${0.2*s}" dy="${0.4*s}"/>
        <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  `;

  // 通用叶子（有机弧度，主脉+侧脉，无机械感）
  function drawLeaf(cx, cy, length, rotate, flip, dark, tiltAdjust) {
    const fillRef = dark ? `url(#${id}-leafDark)` : `url(#${id}-leaf)`;
    const f = flip ? -1 : 1;
    const L = length * s;
    const tilt = tiltAdjust || 0;
    return `
      <g transform="translate(${cx*s},${cy*s}) rotate(${rotate + tilt})">
        <!-- 叶身（左右非完全对称） -->
        <path d="M 0,0
                 C ${f*L*0.32},${-L*0.15} ${f*L*0.55},${-L*0.5} ${f*L*0.38},${-L*0.85}
                 C ${f*L*0.22},${-L*1.0} ${f*L*0.05},${-L*1.05} 0,${-L}
                 C ${-f*L*0.06},${-L*1.05} ${-f*L*0.24},${-L*1.0} ${-f*L*0.42},${-L*0.85}
                 C ${-f*L*0.58},${-L*0.5} ${-f*L*0.32},${-L*0.15} 0,0 Z"
          fill="${fillRef}" opacity="0.92"/>
        <!-- 叶子背光面（深色底） -->
        <path d="M 0,0
                 C ${-f*L*0.06},${-L*1.05} ${-f*L*0.24},${-L*1.0} ${-f*L*0.42},${-L*0.85}
                 C ${-f*L*0.58},${-L*0.5} ${-f*L*0.32},${-L*0.15} 0,0 Z"
          fill="#2a4818" opacity="0.35"/>
        <!-- 主脉 -->
        <path d="M 0,0 Q ${f*0.2*s},${-L*0.5} 0,${-L*0.95}" 
          stroke="#1a3010" stroke-width="${0.3*s}" fill="none" opacity="0.75"/>
        <!-- 侧脉（更柔和、不对称） -->
        ${[0.22, 0.42, 0.62].map((p, i) => `
          <path d="M 0,${-L*p} Q ${f*L*(0.15+i*0.02)},${-L*(p+0.04)} ${f*L*(0.32-i*0.03)},${-L*(p+0.08)}"
            stroke="#1a3010" stroke-width="${0.15*s}" fill="none" opacity="0.45"/>
          <path d="M 0,${-L*(p+0.03)} Q ${-f*L*(0.14+i*0.02)},${-L*(p+0.06)} ${-f*L*(0.3-i*0.03)},${-L*(p+0.1)}"
            stroke="#1a3010" stroke-width="${0.15*s}" fill="none" opacity="0.45"/>
        `).join('')}
      </g>
    `;
  }

  // 包装函数：在花朵外加一层水彩滤镜
  function wrap(inner) {
    return `<g filter="url(#${id}-wash)">${inner}</g>`;
  }


  switch(type) {
    case 'plum': // 梅花 - 古梅枝条 + 5瓣（柔和光影）
      return wrap(`
        <g>${gradients}
          <!-- 古梅枝条 -->
          <g opacity="0.7">
            <path d="M ${-13*s},${10*s} 
                     C ${-10*s},${6*s} ${-7*s},${3*s} ${-3*s},${2*s}"
              stroke="#5a3818" stroke-width="${0.9*s}" fill="none" stroke-linecap="round"/>
            <circle cx="${-7*s}" cy="${5*s}" r="${0.4*s}" fill="#7a4818"/>
            <circle cx="${-10*s}" cy="${7.5*s}" r="${0.3*s}" fill="#7a4818"/>
            <path d="M ${-5*s},${3*s} Q ${-2*s},${5*s} ${3*s},${7*s}"
              stroke="#5a3818" stroke-width="${0.6*s}" fill="none" stroke-linecap="round" opacity="0.7"/>
          </g>
          <g transform="rotate(${rand(0, 5)})">
            <!-- 5片花瓣 -->
            ${[0,72,144,216,288].map((a,i) => {
              const ar = a + rand(i*2, 3);
              const sz = 1 + rand(i*2+1, 0.05);
              return `
                <g transform="rotate(${ar}) scale(${sz})">
                  <!-- 花瓣 -->
                  <path d="M 0,${-2*s}
                           C ${-3*s},${-2*s} ${-4.5*s},${-5*s} ${-3.5*s},${-7*s}
                           C ${-2.5*s},${-9*s} 0,${-9.5*s} 0,${-7.5*s}
                           C 0,${-9.5*s} ${2.5*s},${-9*s} ${3.5*s},${-7*s}
                           C ${4.5*s},${-5*s} ${3*s},${-2*s} 0,${-2*s} Z"
                    fill="url(#${id}-p)" opacity="0.94"/>
                  <!-- 暗面 -->
                  <path d="M 0,${-2*s}
                           C ${-3*s},${-2*s} ${-4.5*s},${-5*s} ${-3.5*s},${-7*s}
                           C ${-2.5*s},${-9*s} 0,${-9.5*s} 0,${-7.5*s}
                           C 0,${-9.5*s} ${2.5*s},${-9*s} ${3.5*s},${-7*s}
                           C ${4.5*s},${-5*s} ${3*s},${-2*s} 0,${-2*s} Z"
                    fill="url(#${id}-pd)" opacity="0.45"/>
                  <!-- 高光 -->
                  <ellipse cx="${(-1 + rand(i*4, 0.2))*s}" cy="${(-6.5 + rand(i*4+1, 0.3))*s}" 
                    rx="${1.2*s}" ry="${1.9*s}" 
                    fill="url(#${id}-h)" opacity="0.65"/>
                </g>
              `;
            }).join('')}
            <!-- 雄蕊群 -->
            ${Array.from({length: 12}).map((_,i) => {
              const a = i * 30 + rand(i*5, 4);
              const len = 3.5 + (i % 3) * 0.3 + rand(i*6, 0.3);
              return `
                <g transform="rotate(${a})">
                  <line x1="0" y1="${-0.5*s}" x2="0" y2="${-len*s}" 
                    stroke="${shade(color,-50)}" stroke-width="${0.2*s}" opacity="0.85"/>
                  <circle cx="0" cy="${-len*s}" r="${0.42*s}" fill="#f0c640"/>
                  <circle cx="${-0.1*s}" cy="${(-len-0.1)*s}" r="${0.15*s}" fill="#fde88c"/>
                </g>
              `;
            }).join('')}
            <!-- 花心 -->
            <circle r="${1*s}" fill="${shade(color,-55)}"/>
            <circle r="${0.5*s}" fill="${shade(color,-65)}"/>
            <circle r="${0.2*s}" fill="#3a0810"/>
          </g>
        </g>`);

    case 'peony': // 牡丹 - 有机的多层重瓣，色彩区分而非线条
      return wrap(`
        <g>${gradients}
          <!-- 牡丹叶 -->
          ${drawLeaf(-9, 8 + rand(1, 0.8), 7.5, -40 + rand(2, 6), false, true, rand(3, 5))}
          ${drawLeaf(-11, 4 + rand(4, 0.8), 6, -72 + rand(5, 5), false, false, rand(6, 4))}
          ${drawLeaf(10, 8 + rand(7, 0.8), 7, 42 + rand(8, 6), true, true, rand(9, 5))}
          ${drawLeaf(11.5, 5 + rand(10, 0.8), 5.5, 70 + rand(11, 5), true, false, rand(12, 4))}
          <g transform="rotate(${rand(0, 4)})">
            <!-- 外层大瓣 8 片 -->
            ${[0,45,90,135,180,225,270,315].map((a,i) => {
              const ar = a + rand(i*2, 4);
              const sz = 1 + rand(i*2+1, 0.06);
              return `
                <g transform="rotate(${ar}) scale(${sz})">
                  <!-- 花瓣本体 -->
                  <path d="M 0,0
                           C ${-5*s},${-2*s} ${-7*s},${-6*s} ${-4*s},${-9*s}
                           C ${-1.5*s},${-10.5*s} ${1.5*s},${-10.5*s} ${4*s},${-9*s}
                           C ${7*s},${-6*s} ${5*s},${-2*s} 0,0 Z"
                    fill="url(#${id}-p)" opacity="0.92"/>
                  <!-- 暗面（瓣底部更暗，营造层次） -->
                  <path d="M 0,0
                           C ${-5*s},${-2*s} ${-7*s},${-6*s} ${-4*s},${-9*s}
                           C ${-1.5*s},${-10.5*s} ${1.5*s},${-10.5*s} ${4*s},${-9*s}
                           C ${7*s},${-6*s} ${5*s},${-2*s} 0,0 Z"
                    fill="url(#${id}-pd)"/>
                  <!-- 高光（柔和椭圆） -->
                  <ellipse cx="${(-1.2 + rand(i*4, 0.3))*s}" cy="${(-6.5 + rand(i*4+1, 0.5))*s}" 
                    rx="${(1.5 + rand(i*5, 0.2))*s}" ry="${(2.2 + rand(i*5+1, 0.3))*s}" 
                    fill="url(#${id}-h)" opacity="0.7"
                    transform="rotate(${rand(i*6, 8)} ${-1.2*s} ${-6.5*s})"/>
                </g>
              `;
            }).join('')}
            <!-- 中层瓣 6 片 -->
            ${[22,82,142,202,262,322].map((a,i) => {
              const ar = a + rand(i*7+20, 5);
              const sz = 1 + rand(i*7+21, 0.07);
              return `
                <g transform="rotate(${ar}) scale(${sz})">
                  <path d="M 0,0
                           C ${-3.5*s},${-1*s} ${-5*s},${-4*s} ${-3*s},${-6.5*s}
                           C ${-1*s},${-8*s} ${1*s},${-8*s} ${3*s},${-6.5*s}
                           C ${5*s},${-4*s} ${3.5*s},${-1*s} 0,0 Z"
                    fill="url(#${id}-p)" opacity="0.95"/>
                  <path d="M 0,0
                           C ${-3.5*s},${-1*s} ${-5*s},${-4*s} ${-3*s},${-6.5*s}
                           C ${-1*s},${-8*s} ${1*s},${-8*s} ${3*s},${-6.5*s}
                           C ${5*s},${-4*s} ${3.5*s},${-1*s} 0,0 Z"
                    fill="url(#${id}-pd)" opacity="0.55"/>
                  <ellipse cx="${(-0.8 + rand(i*8, 0.2))*s}" cy="${(-4.5 + rand(i*8+1, 0.3))*s}" 
                    rx="${1.1*s}" ry="${1.7*s}" fill="url(#${id}-h)" opacity="0.6"/>
                </g>
              `;
            }).join('')}
            <!-- 内层瓣 6 片 -->
            ${[0,60,120,180,240,300].map((a,i) => {
              const ar = a + rand(i*9+30, 5);
              return `
                <g transform="rotate(${ar})">
                  <path d="M 0,0
                           C ${-2.5*s},${0} ${-3.5*s},${-2.5*s} ${-2*s},${-4.5*s}
                           C ${-0.5*s},${-5.5*s} ${0.5*s},${-5.5*s} ${2*s},${-4.5*s}
                           C ${3.5*s},${-2.5*s} ${2.5*s},${0} 0,0 Z"
                    fill="${shade(color, 32)}" opacity="0.96"/>
                  <ellipse cx="${-0.5*s}" cy="${-2.8*s}" rx="${0.8*s}" ry="${1.3*s}" 
                    fill="url(#${id}-h)" opacity="0.55"/>
                </g>
              `;
            }).join('')}
            <!-- 花心皱褶 -->
            ${[30,90,150,210,270,330].map((a,i) => `
              <g transform="rotate(${a + rand(i*11, 6)})">
                <ellipse cx="0" cy="${(-1.5 + rand(i*12, 0.2))*s}" 
                  rx="${0.7*s}" ry="${1.5*s}" 
                  fill="${shade(color, 45)}" opacity="0.92"/>
                <ellipse cx="${-0.2*s}" cy="${-1.8*s}" rx="${0.25*s}" ry="${0.6*s}" 
                  fill="url(#${id}-h)" opacity="0.7"/>
              </g>
            `).join('')}
            <!-- 雄蕊环 -->
            ${Array.from({length: 14}).map((_,i) => {
              const a = i * (360/14) + rand(i*13, 3);
              return `
                <g transform="rotate(${a})">
                  <line x1="0" y1="${-0.4*s}" x2="0" y2="${-2*s}" 
                    stroke="${shade(color,-50)}" stroke-width="${0.18*s}" opacity="0.8"/>
                  <circle cx="0" cy="${-2*s}" r="${0.28*s}" fill="#f0c640"/>
                  <circle cx="${-0.08*s}" cy="${-2.08*s}" r="${0.12*s}" fill="#fde88c"/>
                </g>
              `;
            }).join('')}
            <!-- 中心 -->
            <circle r="${0.9*s}" fill="${shade(color, -55)}"/>
            <circle r="${0.4*s}" fill="#3a0810"/>
          </g>
        </g>`);

    case 'rose': // 月季 - 5心瓣 + 羽状叶（更自然的色彩过渡）
      return wrap(`
        <g>${gradients}
          <!-- 月季羽状叶 -->
          ${drawLeaf(-10, 7 + rand(1, 0.6), 5.5, -55 + rand(2, 5), false, false, rand(3, 4))}
          ${drawLeaf(-8, 11 + rand(4, 0.6), 4.5, -30 + rand(5, 5), false, true, rand(6, 4))}
          ${drawLeaf(10, 7 + rand(7, 0.6), 5.5, 55 + rand(8, 5), true, false, rand(9, 4))}
          ${drawLeaf(8, 11 + rand(10, 0.6), 4.5, 30 + rand(11, 5), true, true, rand(12, 4))}
          <g transform="rotate(${rand(0, 3)})">
            <!-- 5 心瓣 -->
            ${[0,72,144,216,288].map((a,i) => {
              const ar = a + rand(i*3, 4);
              const sz = 1 + rand(i*3+1, 0.05);
              return `
                <g transform="rotate(${ar}) scale(${sz})">
                  <!-- 花瓣 -->
                  <path d="M 0,${-1*s}
                           C ${-4.5*s},${-2*s} ${-7*s},${-5*s} ${-5.5*s},${-8*s}
                           C ${-4*s},${-10*s} ${-2*s},${-10.5*s} ${-0.5*s},${-9*s}
                           L 0,${-8.5*s}
                           L ${0.5*s},${-9*s}
                           C ${2*s},${-10.5*s} ${4*s},${-10*s} ${5.5*s},${-8*s}
                           C ${7*s},${-5*s} ${4.5*s},${-2*s} 0,${-1*s} Z"
                    fill="url(#${id}-p)" opacity="0.94"/>
                  <!-- 暗面 -->
                  <path d="M 0,${-1*s}
                           C ${-4.5*s},${-2*s} ${-7*s},${-5*s} ${-5.5*s},${-8*s}
                           C ${-4*s},${-10*s} ${-2*s},${-10.5*s} ${-0.5*s},${-9*s}
                           L 0,${-8.5*s}
                           L ${0.5*s},${-9*s}
                           C ${2*s},${-10.5*s} ${4*s},${-10*s} ${5.5*s},${-8*s}
                           C ${7*s},${-5*s} ${4.5*s},${-2*s} 0,${-1*s} Z"
                    fill="url(#${id}-pd)" opacity="0.5"/>
                  <!-- 高光 -->
                  <ellipse cx="${(-1.5 + rand(i*5, 0.3))*s}" cy="${(-6 + rand(i*5+1, 0.4))*s}" 
                    rx="${(1.7 + rand(i*6, 0.2))*s}" ry="${(2.4 + rand(i*6+1, 0.3))*s}" 
                    fill="url(#${id}-h)" opacity="0.7"
                    transform="rotate(${rand(i*7, 6)} ${-1.5*s} ${-6*s})"/>
                </g>
              `;
            }).join('')}
            <!-- 内层小瓣 -->
            ${[36,144,252].map((a,i) => {
              const ar = a + rand(i*8+50, 4);
              return `
                <g transform="rotate(${ar})">
                  <path d="M 0,0
                           C ${-2*s},${-1*s} ${-3*s},${-3*s} ${-2*s},${-4.5*s}

            <g transform="rotate(${a})">
              <!-- 主花瓣 -->
              <path d="M 0,${-1*s}
                       C ${-3*s},${-2*s} ${-4*s},${-6*s} ${-2.5*s},${-9*s}
                       C ${-1.2*s},${-10.5*s} 0,${-10*s} 0,${-11*s}
                       C 0,${-10*s} ${1.2*s},${-10.5*s} ${2.5*s},${-9*s}
                       C ${4*s},${-6*s} ${3*s},${-2*s} 0,${-1*s} Z"
                fill="url(#${id}-p)" opacity="0.95"
                stroke="${shade(color,-30)}" stroke-width="${0.32*s}"/>
              <!-- 高光 -->
              <ellipse cx="${-1*s}" cy="${-5*s}" rx="${1*s}" ry="${2.5*s}" 
                fill="url(#${id}-h)" opacity="0.6"/>
              <!-- 皱褶细节 -->
              <path d="M ${-1.5*s},${-4*s} Q 0,${-3*s} ${1.5*s},${-4*s}" 
                stroke="${shade(color,-30)}" stroke-width="${0.28*s}" fill="none" opacity="0.6"/>
              <path d="M ${-1.5*s},${-6*s} Q 0,${-5*s} ${1.5*s},${-6*s}" 
                stroke="${shade(color,-30)}" stroke-width="${0.28*s}" fill="none" opacity="0.6"/>
              <path d="M ${-1*s},${-8*s} Q 0,${-7*s} ${1*s},${-8*s}" 
                stroke="${shade(color,-30)}" stroke-width="${0.22*s}" fill="none" opacity="0.55"/>
              <!-- 中线 -->
              <path d="M 0,${-2*s} Q 0,${-6*s} 0,${-10*s}" 
                stroke="${shade(color,-30)}" stroke-width="${0.22*s}" fill="none" opacity="0.5"/>
            </g>
          `).join('')}
          <!-- 雄蕊群（多而密集） -->
          ${Array.from({length: 14}).map((_,i) => {
            const a = i * (360/14);
            const r = 3.5*s;
            return `
              <g transform="rotate(${a})">
                <line x1="0" y1="0" x2="0" y2="${-r}" stroke="${shade(color, 25)}" stroke-width="${0.28*s}"/>
                <circle cx="0" cy="${-r}" r="${0.42*s}" fill="#f0c640" stroke="#a86818" stroke-width="${0.1*s}"/>
                <circle cx="${-0.1*s}" cy="${(-r-0.1)*s/s*1}" r="${0.15*s}" fill="#fde88c"/>
              </g>
            `;
          }).join('')}
          <circle r="${1.3*s}" fill="${shade(color,-45)}"/>
          <circle r="${0.6*s}" fill="${shade(color,-55)}"/>
        </g>`);

    case 'clivia': // 君子兰 - 6瓣大花，橙色喇叭形
      return wrap(`
        <g>${gradients}
          ${[0,60,120,180,240,300].map(a => `
            <g transform="rotate(${a})">
              <path d="M 0,${-2*s}
                       C ${-3*s},${-4*s} ${-3.5*s},${-8*s} ${-2*s},${-10.5*s}
                       C ${-0.7*s},${-11.5*s} ${0.7*s},${-11.5*s} ${2*s},${-10.5*s}
                       C ${3.5*s},${-8*s} ${3*s},${-4*s} 0,${-2*s} Z"
                fill="url(#${id}-p)" opacity="0.93"
                stroke="${shade(color,-25)}" stroke-width="${0.3*s}"/>
              <!-- 花瓣中线 -->
              <path d="M 0,${-3*s} Q 0,${-7*s} 0,${-10*s}" 
                stroke="${shade(color,-20)}" stroke-width="${0.3*s}" fill="none" opacity="0.6"/>
            </g>
          `).join('')}
          <!-- 雄蕊6条 -->
          ${[0,60,120,180,240,300].map(a => `
            <g transform="rotate(${a+30})">
              <line x1="0" y1="0" x2="0" y2="${-6*s}" stroke="${shade(color,-30)}" stroke-width="${0.35*s}"/>
              <ellipse cx="0" cy="${-6*s}" rx="${0.4*s}" ry="${0.8*s}" fill="${shade(color,-40)}"/>
            </g>
          `).join('')}
          <circle r="${1.2*s}" fill="${shade(color, 20)}"/>
          <circle r="${0.6*s}" fill="${shade(color,-30)}"/>
        </g>`);

    case 'hibiscus': // 朱槿/扶桑 - 5大圆瓣 + 中央深色斑 + 长花柱
      return wrap(`
        <g>${gradients}
          ${[0,72,144,216,288].map(a => `
            <g transform="rotate(${a})">
              <path d="M 0,0
                       C ${-5.5*s},${-2*s} ${-7*s},${-6*s} ${-5*s},${-9*s}
                       C ${-2*s},${-11*s} ${2*s},${-11*s} ${5*s},${-9*s}
                       C ${7*s},${-6*s} ${5.5*s},${-2*s} 0,0 Z"
                fill="url(#${id}-p)" opacity="0.93"
                stroke="${shade(color,-20)}" stroke-width="${0.3*s}"/>
              <!-- 花瓣深色脉纹 -->
              <path d="M 0,${-1*s} Q 0,${-5*s} 0,${-9*s}" 
                stroke="${shade(color,-30)}" stroke-width="${0.4*s}" fill="none" opacity="0.55"/>
            </g>
          `).join('')}
          <!-- 花心深色圆斑 -->
          <ellipse rx="${2.2*s}" ry="${1.8*s}" fill="${shade(color,-50)}" opacity="0.85"/>
          <!-- 标志性长花柱伸出（向上） -->
          <line x1="0" y1="${-1*s}" x2="0" y2="${-12*s}" stroke="${shade(color, 25)}" stroke-width="${0.55*s}"/>
          <!-- 花柱顶端的5裂柱头（向外散开如星形） -->
          ${[0, 72, 144, 216, 288].map(a => `
            <g transform="translate(0,${-12*s}) rotate(${a})">
              <circle cx="${0.6*s}" cy="0" r="${0.45*s}" fill="${shade(color,-30)}"/>
            </g>
          `).join('')}
          <!-- 沿花柱向上的雄蕊（一排排向上指） -->
          ${[-3.5, -5, -6.5, -8, -9.5, -11].map((dy, i) => {
            const off = (i%2 === 0) ? -0.9 : 0.9;
            return `
              <line x1="0" y1="${dy*s}" x2="${off*s}" y2="${(dy-1.3)*s}" stroke="${shade(color, 30)}" stroke-width="${0.25*s}"/>
              <circle cx="${off*s}" cy="${(dy-1.3)*s}" r="${0.35*s}" fill="#f0c640"/>
            `;
          }).join('')}
        </g>`);

    case 'cottonRose': // 芙蓉 - 多层粉色渐变（晓妆如玉暮如霞）
      return wrap(`
        <g>${gradients}
          <!-- 外层5片大瓣（淡粉色） -->
          ${[0,72,144,216,288].map(a => `
            <g transform="rotate(${a})">
              <path d="M 0,${-1*s}
                       C ${-5*s},${-2.5*s} ${-7*s},${-6.5*s} ${-4.5*s},${-9.5*s}
                       C ${-2*s},${-11*s} ${2*s},${-11*s} ${4.5*s},${-9.5*s}
                       C ${7*s},${-6.5*s} ${5*s},${-2.5*s} 0,${-1*s} Z"
                fill="${shade(color, 30)}" opacity="0.88"
                stroke="${shade(color,-15)}" stroke-width="${0.3*s}"/>
              <!-- 花瓣中纹 -->
              <path d="M 0,${-2*s} Q 0,${-6*s} 0,${-10*s}" 
                stroke="${shade(color,-15)}" stroke-width="${0.3*s}" fill="none" opacity="0.35"/>
            </g>
          `).join('')}
          <!-- 中层5瓣（中等粉色） -->
          ${[36,108,180,252,324].map(a => `
            <g transform="rotate(${a})">
              <path d="M 0,0
                       C ${-3.5*s},${-1.5*s} ${-5.5*s},${-5*s} ${-3.5*s},${-7.5*s}
                       C ${-1.5*s},${-8.5*s} ${1.5*s},${-8.5*s} ${3.5*s},${-7.5*s}
                       C ${5.5*s},${-5*s} ${3.5*s},${-1.5*s} 0,0 Z"
                fill="url(#${id}-p)" opacity="0.94"
                stroke="${shade(color,-20)}" stroke-width="${0.25*s}"/>
              <!-- 花瓣脉纹 -->
              <path d="M 0,${-1*s} Q 0,${-4*s} 0,${-7.5*s}" 
                stroke="${shade(color,-25)}" stroke-width="${0.25*s}" fill="none" opacity="0.5"/>
            </g>
          `).join('')}
          <!-- 内层小瓣（深粉色） -->
          ${[0,72,144,216,288].map(a => `
            <g transform="rotate(${a})">
              <path d="M 0,${-0.5*s}
                       C ${-2*s},${-1*s} ${-3*s},${-3.5*s} ${-1.8*s},${-5*s}
                       C ${-0.8*s},${-5.5*s} ${0.8*s},${-5.5*s} ${1.8*s},${-5*s}
                       C ${3*s},${-3.5*s} ${2*s},${-1*s} 0,${-0.5*s} Z"
                fill="${shade(color, -10)}" opacity="0.96"
                stroke="${shade(color,-25)}" stroke-width="${0.2*s}"/>
            </g>
          `).join('')}
          <!-- 中央深红色花心区域 -->
          <ellipse rx="${2.5*s}" ry="${2*s}" fill="${shade(color,-40)}" opacity="0.4"/>
          <!-- 雄蕊群（环形排列） -->
          ${Array.from({length: 12}).map((_,i) => {
            const a = i * 30;
            return `
              <g transform="rotate(${a})">
                <line x1="0" y1="${-0.5*s}" x2="0" y2="${-2.2*s}" stroke="${shade(color,-30)}" stroke-width="${0.25*s}"/>
                <circle cx="0" cy="${-2.2*s}" r="${0.35*s}" fill="#f0c640"/>
              </g>
            `;
          }).join('')}
          <!-- 花心 -->
          <circle r="${0.8*s}" fill="${shade(color,-50)}"/>
          <circle r="${0.4*s}" fill="#a86818"/>
        </g>`);

    case 'bauhinia': // 洋紫荆 - 5瓣兰花状，1上瓣特别窄长
      return wrap(`
        <g>${gradients}
          <!-- 下4瓣 -->
          ${[72, 144, 216, 288].map(a => `
            <g transform="rotate(${a})">
              <path d="M 0,0
                       C ${-2.5*s},${-2*s} ${-3.5*s},${-6*s} ${-2*s},${-9*s}
                       C ${-0.7*s},${-10*s} ${0.7*s},${-10*s} ${2*s},${-9*s}
                       C ${3.5*s},${-6*s} ${2.5*s},${-2*s} 0,0 Z"
                fill="url(#${id}-p)" opacity="0.93"
                stroke="${shade(color,-20)}" stroke-width="${0.25*s}"/>
              <!-- 花瓣中线 -->
              <path d="M 0,${-2*s} Q ${0},${-6*s} 0,${-9*s}" 
                stroke="${shade(color,-25)}" stroke-width="${0.25*s}" fill="none" opacity="0.6"/>
            </g>
          `).join('')}
          <!-- 顶部1瓣（标志性窄长，带斑纹） -->
          <g>
            <path d="M 0,0
                     C ${-1.8*s},${-3*s} ${-2.5*s},${-8*s} ${-1.5*s},${-11*s}
                     C ${-0.5*s},${-12*s} ${0.5*s},${-12*s} ${1.5*s},${-11*s}
                     C ${2.5*s},${-8*s} ${1.8*s},${-3*s} 0,0 Z"
              fill="${shade(color, 5)}" opacity="0.95"
              stroke="${shade(color,-20)}" stroke-width="${0.25*s}"/>
            <!-- 上瓣的标志性条纹 -->
            <path d="M ${-1*s},${-5*s} Q 0,${-6*s} ${1*s},${-5*s}" stroke="${shade(color,-30)}" stroke-width="${0.3*s}" fill="none"/>
            <path d="M ${-0.7*s},${-7*s} Q 0,${-8*s} ${0.7*s},${-7*s}" stroke="${shade(color,-30)}" stroke-width="${0.3*s}" fill="none"/>
            <path d="M ${-0.5*s},${-9*s} Q 0,${-10*s} ${0.5*s},${-9*s}" stroke="${shade(color,-30)}" stroke-width="${0.2*s}" fill="none"/>
          </g>
          <!-- 中央雄蕊 -->
          ${[-30, -15, 0, 15, 30].map(a => `
            <g transform="rotate(${a})">
              <line x1="0" y1="0" x2="0" y2="${-7*s}" stroke="${shade(color, 30)}" stroke-width="${0.25*s}"/>
              <circle cx="0" cy="${-7*s}" r="${0.35*s}" fill="${shade(color,-30)}"/>
            </g>
          `).join('')}
          <circle r="${0.7*s}" fill="${shade(color,-40)}"/>
        </g>`);

    case 'orchid': // 兰花 - 侧面观国画风：5片细长舒展花瓣 + 优雅唇瓣
      return wrap(`
        <g>${gradients}
          <!-- 后方上萼片（垂直向上飘逸） -->
          <g transform="rotate(-5)">
            <path d="M ${-0.5*s},${-2*s}
                     C ${-1.5*s},${-5*s} ${-1.8*s},${-9*s} ${-0.8*s},${-12*s}
                     C ${-0.2*s},${-13*s} ${0.3*s},${-13*s} ${0.6*s},${-11.5*s}
                     C ${0.8*s},${-8*s} ${0.3*s},${-4*s} ${-0.5*s},${-2*s} Z"
              fill="${shade(color,-5)}" opacity="0.88"
              stroke="${shade(color,-25)}" stroke-width="${0.25*s}"/>
          </g>
          <!-- 左侧萼片（向左上） -->
          <g transform="rotate(-75)">
            <path d="M 0,${-1.5*s}
                     C ${-1*s},${-4*s} ${-1.5*s},${-8*s} ${-0.7*s},${-10.5*s}
                     C ${-0.2*s},${-11.5*s} ${0.3*s},${-11.5*s} ${0.7*s},${-10*s}
                     C ${1*s},${-7*s} ${0.5*s},${-3.5*s} 0,${-1.5*s} Z"
              fill="${shade(color,-5)}" opacity="0.88"
              stroke="${shade(color,-25)}" stroke-width="${0.25*s}"/>
          </g>
          <!-- 右侧萼片（向右上） -->
          <g transform="rotate(75)">
            <path d="M 0,${-1.5*s}
                     C ${1*s},${-4*s} ${1.5*s},${-8*s} ${0.7*s},${-10.5*s}
                     C ${0.2*s},${-11.5*s} ${-0.3*s},${-11.5*s} ${-0.7*s},${-10*s}
                     C ${-1*s},${-7*s} ${-0.5*s},${-3.5*s} 0,${-1.5*s} Z"
              fill="${shade(color,-5)}" opacity="0.88"
              stroke="${shade(color,-25)}" stroke-width="${0.25*s}"/>
          </g>
          <!-- 左侧花瓣（弯曲向斜下） -->
          <g transform="rotate(-130)">
            <path d="M 0,${-1*s}
                     C ${-0.8*s},${-3*s} ${-1.2*s},${-6*s} ${-0.5*s},${-8*s}
                     C ${0},${-8.5*s} ${0.4*s},${-8.5*s} ${0.7*s},${-7.5*s}
                     C ${0.9*s},${-5*s} ${0.4*s},${-2.5*s} 0,${-1*s} Z"
              fill="url(#${id}-p)" opacity="0.94"
              stroke="${shade(color,-20)}" stroke-width="${0.22*s}"/>
          </g>
          <!-- 右侧花瓣 -->
          <g transform="rotate(130)">
            <path d="M 0,${-1*s}
                     C ${0.8*s},${-3*s} ${1.2*s},${-6*s} ${0.5*s},${-8*s}
                     C ${0},${-8.5*s} ${-0.4*s},${-8.5*s} ${-0.7*s},${-7.5*s}
                     C ${-0.9*s},${-5*s} ${-0.4*s},${-2.5*s} 0,${-1*s} Z"
              fill="url(#${id}-p)" opacity="0.94"
              stroke="${shade(color,-20)}" stroke-width="${0.22*s}"/>
          </g>
          <!-- 下方唇瓣（向下舒展，呈优雅的舌状） -->
          <path d="M ${-1.2*s},${0}
                   C ${-2*s},${1.5*s} ${-2.2*s},${4*s} ${-1.3*s},${5.5*s}
                   C ${-0.4*s},${6.5*s} ${0.4*s},${6.5*s} ${1.3*s},${5.5*s}
                   C ${2.2*s},${4*s} ${2*s},${1.5*s} ${1.2*s},${0} Z"
            fill="${shade(color, 25)}" opacity="0.96"
            stroke="${shade(color,-20)}" stroke-width="${0.28*s}"/>
          <!-- 唇瓣的散落小斑（国兰特征） -->
          <ellipse cx="${-0.6*s}" cy="${2.5*s}" rx="${0.22*s}" ry="${0.35*s}" fill="${shade(color,-50)}"/>
          <ellipse cx="${0.7*s}" cy="${2*s}" rx="${0.2*s}" ry="${0.3*s}" fill="${shade(color,-50)}"/>
          <ellipse cx="${-0.3*s}" cy="${4*s}" rx="${0.2*s}" ry="${0.3*s}" fill="${shade(color,-50)}"/>
          <ellipse cx="${0.5*s}" cy="${4.5*s}" rx="${0.2*s}" ry="${0.28*s}" fill="${shade(color,-50)}"/>
          <ellipse cx="${-0.9*s}" cy="${1*s}" rx="${0.15*s}" ry="${0.25*s}" fill="${shade(color,-50)}" opacity="0.7"/>
          <!-- 唇瓣轻微卷边线 -->
          <path d="M ${-1.5*s},${4*s} Q ${-1*s},${5*s} ${-0.5*s},${4.5*s}" 
            stroke="${shade(color,-30)}" stroke-width="${0.2*s}" fill="none" opacity="0.5"/>
          <!-- 中央合蕊柱 -->
          <ellipse cy="${-0.5*s}" rx="${0.55*s}" ry="${1.2*s}" fill="${shade(color,-20)}"/>
          <ellipse cy="${-0.8*s}" rx="${0.35*s}" ry="${0.9*s}" fill="#e8a830"/>
          <circle cy="${-1.2*s}" r="${0.3*s}" fill="#a86818"/>
        </g>`);

    case 'cosmos': // 格桑花 - 8瓣，尖头略凹
      return wrap(`
        <g>${gradients}
          ${[0,45,90,135,180,225,270,315].map(a => `
            <g transform="rotate(${a})">
              <path d="M 0,0
                       C ${-2.5*s},${-1.5*s} ${-3*s},${-5*s} ${-2*s},${-8*s}
                       L ${-1*s},${-9*s}
                       L ${-0.3*s},${-7.5*s}
                       L 0,${-9*s}
                       L ${0.3*s},${-7.5*s}
                       L ${1*s},${-9*s}
                       L ${2*s},${-8*s}
                       C ${3*s},${-5*s} ${2.5*s},${-1.5*s} 0,0 Z"
                fill="url(#${id}-p)" opacity="0.93"
                stroke="${shade(color,-20)}" stroke-width="${0.25*s}"/>
              <path d="M 0,${-1*s} Q 0,${-5*s} 0,${-8*s}" 
                stroke="${shade(color,-25)}" stroke-width="${0.25*s}" fill="none" opacity="0.55"/>
            </g>
          `).join('')}
          <!-- 中心黄花心 -->
          <circle r="${2.2*s}" fill="#f0c640"/>
          ${Array.from({length: 12}).map((_,i) => {
            const a = i * 30;
            return `
              <circle cx="0" cy="${-1.4*s}" r="${0.3*s}" fill="#a86818" transform="rotate(${a})"/>
            `;
          }).join('')}
          <circle r="${0.8*s}" fill="#7a4818"/>
        </g>`);

    case 'iris': // 鸢尾/马兰 - 6瓣呈完美六角放射，3上立 + 3下垂带黄斑
      // 所有瓣都用朝上的 path，用 60 度间隔旋转
      // 下垂瓣旋转到 60、180、-60度（朝右下、正下、左下）
      // 上立瓣旋转到 0、120、-120度（朝上、右下偏后、左下偏后）
      // 重点：用大半径的下垂瓣 + 短小的上立瓣 区分
      return wrap(`
        <g>${gradients}
          <!-- 下垂瓣（向下、左下、右下）- 较大较饱满 -->
          ${[180, 60, -60].map(a => `
            <g transform="rotate(${a})">
              <path d="M 0,${-2*s}
                       C ${-3.5*s},${-3*s} ${-4*s},${-7*s} ${-2.5*s},${-10*s}
                       C ${-1*s},${-11.5*s} ${1*s},${-11.5*s} ${2.5*s},${-10*s}
                       C ${4*s},${-7*s} ${3.5*s},${-3*s} 0,${-2*s} Z"
                fill="${shade(color, -10)}" opacity="0.92"
                stroke="${shade(color,-30)}" stroke-width="${0.3*s}"/>
              <!-- 黄色信号纹（鸢尾特征） -->
              <ellipse cx="0" cy="${-6*s}" rx="${0.9*s}" ry="${3.5*s}" fill="#f0c640" opacity="0.9"/>
              <path d="M 0,${-3*s} Q 0,${-7*s} 0,${-10*s}" stroke="#a86818" stroke-width="${0.3*s}" fill="none" opacity="0.7"/>
            </g>
          `).join('')}
          <!-- 上立瓣（正上、左上、右上）- 较窄较挺立 -->
          ${[0, 120, -120].map(a => `
            <g transform="rotate(${a})">
              <path d="M 0,${-1*s}
                       C ${-2.3*s},${-2.5*s} ${-2.8*s},${-6*s} ${-1.5*s},${-8*s}
                       C ${-0.5*s},${-9*s} ${0.5*s},${-9*s} ${1.5*s},${-8*s}
                       C ${2.8*s},${-6*s} ${2.3*s},${-2.5*s} 0,${-1*s} Z"
                fill="url(#${id}-p)" opacity="0.95"
                stroke="${shade(color,-25)}" stroke-width="${0.3*s}"/>
              <!-- 立瓣脉纹 -->
              <path d="M 0,${-2*s} Q 0,${-5*s} 0,${-8*s}" 
                stroke="${shade(color,-30)}" stroke-width="${0.25*s}" fill="none" opacity="0.5"/>
            </g>
          `).join('')}
          <!-- 中心 -->
          <circle r="${1*s}" fill="${shade(color,-30)}"/>
          <circle r="${0.5*s}" fill="#e8a830"/>
        </g>`);

    default:
      return wrap(`<circle r="${5*s}" fill="${color}"/>`);
  }
}

// Canvas 水彩花朵引擎（新）
