function generateShareImage(cityName) {
  const info = CITY_FLOWERS[cityName];
  if (!info) return;
  const flower = info.flowers[0];
  const ext = FLOWER_INFO[flower.type] || {};
  
  // 卡片尺寸 (竖版,适合手机分享)
  const W = 750, H = 1280;
  const canvas = document.createElement('canvas');
  const dpr = 2; // 高清
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  
  // 1. 背景:水彩纸感
  // 主底色根据当前季节
  const season = getSeason(currentMonth);
  const bgGradients = {
    spring: ['#f5f0e0', '#e8e8d2', '#d8e0c8'],
    summer: ['#f0ecda', '#e0e2c5', '#d0dab2'],
    autumn: ['#f7ecce', '#f0dca8', '#e5c585'],
    winter: ['#f6f3ec', '#ebe8e0', '#ddd8cc']
  };
  const colors = bgGradients[season];
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, colors[0]);
  bg.addColorStop(0.5, colors[1]);
  bg.addColorStop(1, colors[2]);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  
  // 撒上水彩斑点 + 纸纹
  const rand = mulberry32(cityName.charCodeAt(0) * 1000 + flower.type.length);
  for (let i = 0; i < 30; i++) {
    const x = rand() * W;
    const y = rand() * H;
    const r = 60 + rand() * 180;
    const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `rgba(195, 165, 110, ${0.06 + rand()*0.10})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }
  // 纸颗粒
  const imgData = ctx.getImageData(0, 0, W, H);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    if (Math.random() < 0.04) {
      const v = (Math.random() - 0.5) * 25;
      data[i] = Math.max(0, Math.min(255, data[i] + v));
      data[i+1] = Math.max(0, Math.min(255, data[i+1] + v*0.85));
      data[i+2] = Math.max(0, Math.min(255, data[i+2] + v*0.6));
    }
  }
  ctx.putImageData(imgData, 0, 0);
  
  // 2. 边框装饰(古籍风)
  ctx.strokeStyle = '#8a7654';
  ctx.lineWidth = 1;
  ctx.strokeRect(40, 40, W-80, H-80);
  ctx.strokeRect(50, 50, W-100, H-100);
  // 四角
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#7a1f33';
  const cornerSize = 24;
  const drawCorner = (x, y, dx, dy) => {
    ctx.beginPath();
    ctx.moveTo(x + dx * cornerSize, y);
    ctx.lineTo(x, y);
    ctx.lineTo(x, y + dy * cornerSize);
    ctx.stroke();
  };
  drawCorner(60, 60, 1, 1);
  drawCorner(W-60, 60, -1, 1);
  drawCorner(60, H-60, 1, -1);
  drawCorner(W-60, H-60, -1, -1);
  
  // 3. 标题:百城花信
  ctx.fillStyle = '#1a1612';
  ctx.font = 'bold 32px "Ma Shan Zheng", "Noto Serif SC", serif';
  ctx.textAlign = 'center';
  ctx.fillText('百城花信', W/2, 130);
  
  ctx.font = 'italic 16px "Cormorant Garamond", serif';
  ctx.fillStyle = '#a8324a';
  ctx.fillText('A FLORAL ATLAS', W/2, 158);
  
  // 装饰横线
  ctx.strokeStyle = '#8a7654';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(W/2 - 120, 180);
  ctx.lineTo(W/2 + 120, 180);
  ctx.stroke();
  // 中间小菱形
  ctx.fillStyle = '#a8324a';
  ctx.beginPath();
  ctx.moveTo(W/2, 175);
  ctx.lineTo(W/2 + 5, 180);
  ctx.lineTo(W/2, 185);
  ctx.lineTo(W/2 - 5, 180);
  ctx.closePath();
  ctx.fill();
  
  // 4. 城市名(大字)
  ctx.fillStyle = '#1a1612';
  ctx.font = 'bold 72px "Noto Serif SC", serif';
  ctx.fillText(cityName, W/2, 280);
  
  // 拼音
  ctx.fillStyle = '#b8893a';
  ctx.font = 'italic 18px "Cormorant Garamond", serif';
  ctx.fillText(info.pinyin || '', W/2, 314);
  
  // 省份
  ctx.fillStyle = '#6b5a45';
  ctx.font = '15px "Noto Serif SC", serif';
  ctx.fillText(info.province, W/2, 342);
  
  // 5. 中间圆框 + 水彩植物画
  const portraitCX = W/2;
  const portraitCY = 580;
  const portraitR = 200;
  
  // 圆形阴影底
  ctx.save();
  ctx.shadowColor = 'rgba(40, 25, 15, 0.15)';
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 4;
  ctx.fillStyle = 'rgba(255, 252, 242, 0.7)';
  ctx.beginPath();
  ctx.arc(portraitCX, portraitCY, portraitR, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
  
  // 虚线圈
  ctx.strokeStyle = '#a89578';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 4]);
  ctx.beginPath();
  ctx.arc(portraitCX, portraitCY, portraitR - 8, 0, Math.PI*2);
  ctx.stroke();
  ctx.setLineDash([]);
  
  // 植物画(用现有的 paintPlantPortrait)
  ctx.save();
  ctx.beginPath();
  ctx.arc(portraitCX, portraitCY, portraitR - 12, 0, Math.PI*2);
  ctx.clip();
  const portraitRand = mulberry32(flower.type.length * 1000 + cityName.charCodeAt(0));
  const portraitColor = hexToRgb(flower.color);
  paintPlantPortrait(ctx, portraitCX, portraitCY, portraitR * 2, flower.type, portraitColor, portraitRand);
  ctx.restore();
  
  // 印章
  ctx.fillStyle = '#a8324a';
  ctx.fillRect(portraitCX + portraitR - 30, portraitCY + portraitR - 30, 50, 50);
  ctx.fillStyle = '#f5ecdb';
  ctx.font = 'bold 28px "Noto Serif SC", serif';
  ctx.textAlign = 'center';
  ctx.fillText(flower.name.charAt(0), portraitCX + portraitR - 5, portraitCY + portraitR + 5);
  
  // 6. 花卉名
  ctx.fillStyle = '#1a1612';
  ctx.font = 'bold 48px "Noto Serif SC", serif';
  ctx.textAlign = 'center';
  ctx.fillText(flower.name, W/2, 870);
  
  ctx.fillStyle = '#b8893a';
  ctx.font = 'italic 18px "Cormorant Garamond", serif';
  ctx.fillText(flower.latin, W/2, 900);
  
  // 寓意
  if (ext.meaning) {
    ctx.fillStyle = '#3d2f24';
    ctx.font = '17px "Noto Serif SC", serif';
    ctx.fillText('「' + ext.meaning + '」', W/2, 945);
  }
  
  // 7. 诗句
  if (ext.poem) {
    ctx.fillStyle = '#7a1f33';
    ctx.font = 'italic 20px "Noto Serif SC", serif';
    // 长诗可能要换行 - 按句号或逗号分段
    const poemLines = ext.poem.split(/[。]/).filter(s => s.trim()).map(s => s.trim() + (s.endsWith('。')?'':''));
    let py = 1020;
    for (let line of poemLines.slice(0, 2)) {
      // 每行最多 20 字,超过再分
      if (line.length > 22) {
        const mid = Math.ceil(line.length/2);
        const cutAt = line.indexOf('，', mid - 4) >= 0 ? line.indexOf('，', mid - 4) + 1 : mid;
        ctx.fillText(line.slice(0, cutAt), W/2, py);
        py += 32;
        ctx.fillText(line.slice(cutAt), W/2, py);
      } else {
        ctx.fillText(line, W/2, py);
      }
      py += 32;
    }
    
    if (ext.poemAuthor) {
      ctx.fillStyle = '#6b5a45';
      ctx.font = '14px "Noto Serif SC", serif';
      ctx.textAlign = 'right';
      ctx.fillText('— ' + ext.poemAuthor, W - 100, py + 8);
    }
  }
  
  // 8. 花期
  ctx.fillStyle = '#3d2f24';
  ctx.font = '14px "Noto Serif SC", serif';
  ctx.textAlign = 'center';
  const monthsText = flower.months.map(m => monthNames[m]).join('、');
  ctx.fillText('花期 · ' + monthsText, W/2, H - 150);
  
  // 9. 落款
  ctx.fillStyle = '#a89578';
  ctx.font = 'italic 13px "Cormorant Garamond", serif';
  ctx.fillText('百城花信 · Anno MMXXVI', W/2, H - 90);
  
  // 导出为图片
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `百城花信_${cityName}_${flower.name}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
}

// =========================================================================
// 城市悬停诗句 tooltip
// =========================================================================
function initHoverTooltip() {
  // 创建 tooltip 元素
  const tooltip = document.createElement('div');
  tooltip.className = 'poem-tooltip';
  tooltip.style.display = 'none';
  document.body.appendChild(tooltip);
  
  let currentDot = null;
  
  function positionAtDot(dot) {
    // 把 tooltip 锚定到城市花朵下方
    const rect = dot.getBoundingClientRect();
    // 先显示出来才能拿到 tooltip 自己的尺寸
    tooltip.style.left = '-9999px';
    tooltip.style.top = '0px';
    tooltip.style.display = 'block';
    const ttW = tooltip.offsetWidth;
    const ttH = tooltip.offsetHeight;
    // 居中对齐到 dot 中心,放在 dot 下方
    let x = rect.left + rect.width / 2 - ttW / 2;
    let y = rect.bottom + 8;
    // 边界处理:不超出窗口
    const winW = window.innerWidth;
    const winH = window.innerHeight;
    x = Math.max(8, Math.min(x, winW - ttW - 8));
    // 如果下方放不下,放到上方
    if (y + ttH > winH - 8) {
      y = rect.top - ttH - 8;
    }
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
  }
  
  document.addEventListener('mouseover', e => {
    const dot = e.target.closest('.city-dot');
    if (!dot || dot === currentDot) return;
    currentDot = dot;
    const poem = dot.dataset.poem;
    const flowerName = dot.dataset.flowerName;
    if (!flowerName) return;
    
    tooltip.innerHTML = `
      <div class="poem-flower-name">${flowerName}</div>
      ${poem ? `<div class="poem-line">${poem}</div>` : ''}
    `;
    positionAtDot(dot);
    requestAnimationFrame(() => tooltip.classList.add('show'));
  });
  
  document.addEventListener('mouseout', e => {
    const dot = e.target.closest('.city-dot');
    if (dot && (!e.relatedTarget || !e.relatedTarget.closest('.city-dot'))) {
      tooltip.classList.remove('show');
      currentDot = null;
      setTimeout(() => {
        if (!currentDot) tooltip.style.display = 'none';
      }, 250);
    }
  });
  
  // 点击或地图拖动/缩放/切层时也隐藏 tooltip
  function hideTooltip() {
    tooltip.classList.remove('show');
    currentDot = null;
    setTimeout(() => { if (!currentDot) tooltip.style.display = 'none'; }, 200);
  }
  document.addEventListener('click', hideTooltip);
  document.addEventListener('wheel', hideTooltip, {passive: true});
}

// =========================================================================
// 地图缩放和拖动 v2 — 更科学的交互
// =========================================================================
function initMapZoomPan() {
  const svg = document.getElementById('map');
  if (!svg) return;
  
  // 初始 viewBox
  const initialViewBox = svg.getAttribute('viewBox').split(/\s+/).map(Number);
  let [vbX, vbY, vbW, vbH] = initialViewBox;
  const originalVB = [...initialViewBox];
  
  // 当前缩放级别 (1 = 原始, 越大越放大)
  let currentScale = 1;
  const MIN_SCALE = 1;       // 不允许缩到比原始还小
  const MAX_SCALE = 6;       // 最大 6 倍
  
  // 给 SVG 加 transition 让缩放更顺滑（用 CSS transform 不好做矢量,改用 JS 动画）
  let animFrame = null;
  let targetVB = null;
  
  function setViewBoxAnimated(toX, toY, toW, toH, duration = 280) {
    cancelAnimationFrame(animFrame);
    const startVB = [vbX, vbY, vbW, vbH];
    const endVB = [toX, toY, toW, toH];
    const startTime = performance.now();
    
    function step(now) {
      const t = Math.min(1, (now - startTime) / duration);
      // ease-out cubic
      const e = 1 - Math.pow(1 - t, 3);
      vbX = startVB[0] + (endVB[0] - startVB[0]) * e;
      vbY = startVB[1] + (endVB[1] - startVB[1]) * e;
      vbW = startVB[2] + (endVB[2] - startVB[2]) * e;
      vbH = startVB[3] + (endVB[3] - startVB[3]) * e;
      svg.setAttribute('viewBox', `${vbX} ${vbY} ${vbW} ${vbH}`);
      updateZoomUI();
      if (t < 1) animFrame = requestAnimationFrame(step);
    }
    animFrame = requestAnimationFrame(step);
  }
  
  function setViewBox(x, y, w, h) {
    cancelAnimationFrame(animFrame);
    vbX = x; vbY = y; vbW = w; vbH = h;
    svg.setAttribute('viewBox', `${vbX} ${vbY} ${vbW} ${vbH}`);
    updateZoomUI();
  }
  
  // 围绕一个点缩放(point in viewBox 坐标系)
  function zoomAt(focusVbX, focusVbY, targetScale, animated = true) {
    targetScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, targetScale));
    if (targetScale === currentScale) return;
    
    const newW = originalVB[2] / targetScale;
    const newH = originalVB[3] / targetScale;
    
    // 焦点相对于 viewBox 的比例
    const rx = (focusVbX - vbX) / vbW;
    const ry = (focusVbY - vbY) / vbH;
    
    const newX = focusVbX - rx * newW;
    const newY = focusVbY - ry * newH;
    
    currentScale = targetScale;
    if (animated) {
      setViewBoxAnimated(newX, newY, newW, newH);
    } else {
      setViewBox(newX, newY, newW, newH);
    }
  }
  
  function zoomBy(factor) {
    // 以当前 viewBox 中心为焦点
    zoomAt(vbX + vbW/2, vbY + vbH/2, currentScale * factor);
  }
  
  function resetView() {
    currentScale = 1;
    setViewBoxAnimated(originalVB[0], originalVB[1], originalVB[2], originalVB[3], 400);
  }
  
  // 屏幕坐标 → viewBox 坐标
  function screenToVb(clientX, clientY) {
    const rect = svg.getBoundingClientRect();
    return {
      x: vbX + ((clientX - rect.left) / rect.width) * vbW,
      y: vbY + ((clientY - rect.top) / rect.height) * vbH
    };
  }
  
  // ============ 滚轮:Ctrl/⌘ + 滚轮才缩放,否则正常滚动页面 ============
  let scrollHintTimeout = null;
  svg.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) {
      // 缩放
      e.preventDefault();
      const focus = screenToVb(e.clientX, e.clientY);
      const factor = e.deltaY > 0 ? 1/1.18 : 1.18;
      zoomAt(focus.x, focus.y, currentScale * factor, false);
    } else {
      // 普通滚动 → 提示一下,但不阻止
      showScrollHint();
    }
  }, { passive: false });
  
  function showScrollHint() {
    const hint = document.querySelector('.zoom-scroll-hint');
    if (!hint) return;
    hint.classList.add('show');
    clearTimeout(scrollHintTimeout);
    scrollHintTimeout = setTimeout(() => hint.classList.remove('show'), 1500);
  }
  
  // ============ 拖动平移(鼠标) ============
  let isDragging = false;
  let dragStart = null;
  let dragStartVB = null;
  
  svg.addEventListener('mousedown', e => {
    // 只在背景拖动,城市点击优先
    const targ = e.target;
    if (targ.tagName === 'image' || targ.classList.contains('hitarea') ||
        targ.closest('.city-label-group')) {
      return;
    }
    isDragging = true;
    dragStart = {x: e.clientX, y: e.clientY};
    dragStartVB = {x: vbX, y: vbY};
    svg.style.cursor = 'grabbing';
    e.preventDefault();
  });
  
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const rect = svg.getBoundingClientRect();
    const dx = (e.clientX - dragStart.x) * (vbW / rect.width);
    const dy = (e.clientY - dragStart.y) * (vbH / rect.height);
    setViewBox(dragStartVB.x - dx, dragStartVB.y - dy, vbW, vbH);
  });
  
  window.addEventListener('mouseup', () => {
    if (isDragging) {
      isDragging = false;
      svg.style.cursor = currentScale > 1 ? 'grab' : 'default';
    }
  });
  
  // ============ 触摸:单指拖动 + 双指 pinch 缩放 ============
  let touchStartDist = 0;
  let touchStartScale = 1;
  let touchStartCenter = null;
  let touchStartVB = null;
  let touchSingleStart = null;
  
  svg.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      // 双指 pinch
      const t1 = e.touches[0], t2 = e.touches[1];
      touchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      touchStartScale = currentScale;
      const cx = (t1.clientX + t2.clientX) / 2;
      const cy = (t1.clientY + t2.clientY) / 2;
      touchStartCenter = screenToVb(cx, cy);
      touchStartVB = {x: vbX, y: vbY, w: vbW, h: vbH};
      e.preventDefault();
    } else if (e.touches.length === 1) {
      // 单指拖动 - 只在地图背景上(避开城市)
      const targ = e.target;
      if (targ.tagName === 'image' || targ.classList.contains('hitarea') ||
          targ.closest('.city-label-group')) {
        return;
      }
      touchSingleStart = {
        x: e.touches[0].clientX,
        y: e.touches[0].clientY,
        vbX, vbY
      };
    }
  }, { passive: false });
  
  svg.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && touchStartCenter) {
      e.preventDefault();
      const t1 = e.touches[0], t2 = e.touches[1];
      const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      const newScale = touchStartScale * (dist / touchStartDist);
      zoomAt(touchStartCenter.x, touchStartCenter.y, newScale, false);
    } else if (e.touches.length === 1 && touchSingleStart) {
      e.preventDefault();
      const rect = svg.getBoundingClientRect();
      const dx = (e.touches[0].clientX - touchSingleStart.x) * (vbW / rect.width);
      const dy = (e.touches[0].clientY - touchSingleStart.y) * (vbH / rect.height);
      setViewBox(touchSingleStart.vbX - dx, touchSingleStart.vbY - dy, vbW, vbH);
    }
  }, { passive: false });
  
  svg.addEventListener('touchend', () => {
    touchStartCenter = null;
    touchSingleStart = null;
  });
  
  // ============ 双击放大 ============
  svg.addEventListener('dblclick', e => {
    const targ = e.target;
    if (targ.closest('.city-dot')) return; // 城市双击不缩放
    e.preventDefault();
    if (currentScale > 1.5) {
      resetView();
    } else {
      const focus = screenToVb(e.clientX, e.clientY);
      zoomAt(focus.x, focus.y, 2.5);
    }
  });
  
  // ============ 控制面板 UI ============
  const mapFrame = document.querySelector('.map-frame');
  const controls = document.createElement('div');
  controls.className = 'zoom-controls';
  controls.innerHTML = `
    <button class="zoom-btn" data-action="in" title="放大 (或按住 Ctrl 滚轮)" aria-label="放大地图">+</button>
    <div class="zoom-indicator" id="zoomIndicator">100%</div>
    <button class="zoom-btn" data-action="out" title="缩小" aria-label="缩小地图">−</button>
    <button class="zoom-btn zoom-reset" data-action="reset" title="复位" aria-label="复位地图">⟲</button>
  `;
  mapFrame.appendChild(controls);
  
  // 滚轮提示
  const hint = document.createElement('div');
  hint.className = 'zoom-scroll-hint';
  hint.textContent = '按住 Ctrl 滚轮可缩放';
  mapFrame.appendChild(hint);
  
  controls.addEventListener('click', e => {
    const btn = e.target.closest('.zoom-btn');
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'in') zoomBy(1.4);
    else if (action === 'out') zoomBy(1/1.4);
    else if (action === 'reset') resetView();
  });
  
  function updateZoomUI() {
    const ind = document.getElementById('zoomIndicator');
    if (ind) ind.textContent = Math.round(currentScale * 100) + '%';
    svg.style.cursor = currentScale > 1.01 ? 'grab' : 'default';
  }
  updateZoomUI();
  
  // 暴露给外部(选中城市时可以平滑聚焦到该城市)
  window.zoomToCity = function(cityName) {
    const dot = document.querySelector(`.city-dot[data-city="${cityName}"]`);
    if (!dot) return;
    const tr = dot.getAttribute('transform');
    const m = tr && tr.match(/translate\(([\d.-]+),\s*([\d.-]+)\)/);
    if (!m) return;
    const cx = parseFloat(m[1]), cy = parseFloat(m[2]);
    // 缩到 2.2x,以城市为中心
    const targetScale = Math.max(currentScale, 2.2);
    const newW = originalVB[2] / targetScale;
    const newH = originalVB[3] / targetScale;
    currentScale = targetScale;
    setViewBoxAnimated(cx - newW/2, cy - newH/2, newW, newH, 500);
  };
}
