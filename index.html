// 14. 杜鹃 - 5瓣漏斗 + 雄蕊伸出
function drawAzaleaCanvas(ctx, cx, cy, s, color, rand) {
  drawLeaf(ctx, cx - 105*s, cy + 35*s, 38*s, 55*s, -0.85, rand, true);
  drawLeaf(ctx, cx - 75*s, cy + 100*s, 32*s, 42*s, -0.3, rand, false);
  drawLeaf(ctx, cx + 105*s, cy + 35*s, 38*s, 55*s, 0.85, rand, true);
  drawLeaf(ctx, cx + 75*s, cy + 100*s, 32*s, 42*s, 0.3, rand, false);
  
  // 5 瓣漏斗形
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2 - Math.PI/2 + (rand()-0.5)*0.08;
    const colorVar = color.map(c => Math.max(0, Math.min(255, c + (rand()-0.5)*12)));
    watercolorPetal(ctx, cx, cy, 55*s, 85*s, angle, colorVar, rand, {rounded: true});
  }
  
  // 上方两瓣的斑点（杜鹃特征）
  for (let dotI = 0; dotI < 2; dotI++) {
    const a = (dotI === 0 ? 36 : -36) * Math.PI / 180 - Math.PI/2;
    const r = 55 * s;
    for (let i = 0; i < 5; i++) {
      const offset = (rand() - 0.5) * 20 * s;
      const dist = (0.4 + rand() * 0.4) * r;
      const px = cx + Math.cos(a) * dist + offset;
      const py = cy + Math.sin(a) * dist + offset;
      ctx.fillStyle = `rgba(${color[0]*0.4|0}, ${color[1]*0.3|0}, ${color[2]*0.4|0}, 0.7)`;
      ctx.beginPath();
      ctx.arc(px, py, (2 + rand()*1.5)*s, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  
  // 5 根雄蕊（弯曲伸出）
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2 - Math.PI/2 + Math.PI/5;
    ctx.strokeStyle = `rgba(${color[0]*0.5|0}, ${color[1]*0.5|0}, ${color[2]*0.5|0}, 0.85)`;
    ctx.lineWidth = 1.2*s;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    const endX = cx + Math.cos(angle) * 75*s;
    const endY = cy + Math.sin(angle) * 75*s;
    const midX = cx + Math.cos(angle) * 40*s + Math.cos(angle + Math.PI/2) * 4*s;
    const midY = cy + Math.sin(angle) * 40*s + Math.sin(angle + Math.PI/2) * 4*s;
    ctx.quadraticCurveTo(midX, midY, endX, endY);
    ctx.stroke();
    
    const grad = ctx.createRadialGradient(endX, endY, 0, endX, endY, 4*s);
    grad.addColorStop(0, '#fde88c');
    grad.addColorStop(0.6, '#f0c640');
    grad.addColorStop(1, '#a86818');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(endX, endY, 3.5*s, 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.fillStyle = `rgba(${color[0]*0.4|0}, ${color[1]*0.3|0}, ${color[2]*0.4|0}, 0.9)`;
  ctx.beginPath();
  ctx.arc(cx, cy, 6*s, 0, Math.PI * 2);
  ctx.fill();
}

// 15. 石榴花 - 6片皱褶花瓣
function drawPomegranateCanvas(ctx, cx, cy, s, color, rand) {
  drawLeaf(ctx, cx - 100*s, cy + 25*s, 38*s, 55*s, -0.85, rand, true);
  drawLeaf(ctx, cx - 70*s, cy + 100*s, 32*s, 42*s, -0.3, rand, false);
  drawLeaf(ctx, cx + 100*s, cy + 25*s, 38*s, 55*s, 0.85, rand, true);
  drawLeaf(ctx, cx + 70*s, cy + 100*s, 32*s, 42*s, 0.3, rand, false);
  
  // 6 皱褶瓣
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2 - Math.PI/2 + (rand()-0.5)*0.08;
    const colorVar = color.map(c => Math.max(0, Math.min(255, c + (rand()-0.5)*15)));
    watercolorPetal(ctx, cx, cy, 36*s, 100*s, angle, colorVar, rand, {tipPointed: true});
  }
  
  // 14 根雄蕊
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2 + (rand()-0.5)*0.08;
    const len = (32 + rand() * 4) * s;
    ctx.strokeStyle = `rgba(${color[0]*0.6|0}, ${color[1]*0.4|0}, ${color[2]*0.3|0}, 0.85)`;
    ctx.lineWidth = 1.1*s;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len);
    ctx.stroke();
    
    const px = cx + Math.cos(a) * len, py = cy + Math.sin(a) * len;
    const grad = ctx.createRadialGradient(px, py, 0, px, py, 4*s);
    grad.addColorStop(0, '#fde88c');
    grad.addColorStop(0.6, '#f0c640');
    grad.addColorStop(1, '#a86818');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(px, py, 3.5*s, 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.fillStyle = `rgba(${color[0]*0.4|0}, ${color[1]*0.25|0}, ${color[2]*0.2|0}, 0.95)`;
  ctx.beginPath();
  ctx.arc(cx, cy, 11*s, 0, Math.PI * 2);
  ctx.fill();
}

// 16. 君子兰 - 6瓣大花
function drawCliviaCanvas(ctx, cx, cy, s, color, rand) {
  // 6 瓣
  for (let i = 0; i < 6; i++) {
    const angle = (i / 6) * Math.PI * 2 - Math.PI/2 + (rand()-0.5)*0.05;
    const colorVar = color.map(c => Math.max(0, Math.min(255, c + (rand()-0.5)*12)));
    watercolorPetal(ctx, cx, cy, 35*s, 100*s, angle, colorVar, rand, {tipPointed: true});
    
    // 中线（君子兰特征）
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.strokeStyle = `rgba(${colorVar[0]*0.5|0}, ${colorVar[1]*0.3|0}, ${colorVar[2]*0.3|0}, 0.5)`;
    ctx.lineWidth = 1.5*s;
    ctx.beginPath();
    ctx.moveTo(0, -5*s);
    ctx.lineTo(0, -90*s);
    ctx.stroke();
    ctx.restore();
  }
  
  // 中央星形高光
  ctx.fillStyle = 'rgba(255, 240, 200, 0.6)';
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const r = i % 2 === 0 ? 14*s : 6*s;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();
  
  // 花心
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 8*s);
  grad.addColorStop(0, '#fde88c');
  grad.addColorStop(1, '#a86818');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, 7*s, 0, Math.PI * 2);
  ctx.fill();
}

// 17. 朱槿 - 5大圆瓣 + 长花柱
function drawHibiscusCanvas(ctx, cx, cy, s, color, rand) {
  // 5 大圆瓣
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2 - Math.PI/2 + (rand()-0.5)*0.08;
    const colorVar = color.map(c => Math.max(0, Math.min(255, c + (rand()-0.5)*12)));
    watercolorPetal(ctx, cx, cy, 70*s, 100*s, angle, colorVar, rand, {rounded: true});
  }
  
  // 中央深色花心
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 22*s);
  grad.addColorStop(0, `rgba(${color[0]*0.4|0}, ${color[1]*0.25|0}, ${color[2]*0.3|0}, 1)`);
  grad.addColorStop(1, `rgba(${color[0]*0.5|0}, ${color[1]*0.3|0}, ${color[2]*0.4|0}, 0)`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, 20*s, 0, Math.PI * 2);
  ctx.fill();
  
  // 长花柱（标志性向上伸出）
  ctx.strokeStyle = `rgba(${color[0]*0.6|0}, ${color[1]*0.4|0}, ${color[2]*0.4|0}, 0.9)`;
  ctx.lineWidth = 2.5*s;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx, cy - 95*s);
  ctx.stroke();
  
  // 沿花柱的雄蕊
  for (let i = 0; i < 6; i++) {
    const dy = -25 - i * 12;
    const off = (i % 2 === 0) ? -7 : 7;
    ctx.strokeStyle = `rgba(${color[0]*0.6|0}, ${color[1]*0.4|0}, ${color[2]*0.4|0}, 0.7)`;
    ctx.lineWidth = 1.2*s;
    ctx.beginPath();
    ctx.moveTo(cx, cy + dy*s);
    ctx.lineTo(cx + off*s, cy + (dy - 10)*s);
    ctx.stroke();
    
    const px = cx + off*s, py = cy + (dy - 10)*s;
    ctx.fillStyle = '#f0c640';
    ctx.beginPath();
    ctx.arc(px, py, 3*s, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // 顶端 5 裂柱头（红色小球）
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    ctx.fillStyle = `rgba(${color[0]*0.5|0}, ${color[1]*0.3|0}, ${color[2]*0.4|0}, 1)`;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * 6*s, cy - 95*s + Math.sin(a) * 6*s, 4*s, 0, Math.PI * 2);
    ctx.fill();
  }
}

// 18. 芙蓉 - 多层粉色渐变
function drawCottonRoseCanvas(ctx, cx, cy, s, color, rand) {
  // 外层 5 瓣（淡）
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2 - Math.PI/2 + (rand()-0.5)*0.08;
    const lighter = [Math.min(255, color[0]+45), Math.min(255, color[1]+40), Math.min(255, color[2]+30)];
    watercolorPetal(ctx, cx, cy, 70*s, 95*s, angle, lighter, rand, {rounded: true});
  }
  
  // 中层 5 瓣（中色）
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2 - Math.PI/2 + Math.PI/5;
    watercolorPetal(ctx, cx, cy, 50*s, 70*s, angle, color, rand, {rounded: true});
  }
  
  // 内层 5 瓣（深）
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2 - Math.PI/2;
    const darker = [Math.max(0, color[0]-20), Math.max(0, color[1]-15), Math.max(0, color[2]-10)];
    watercolorPetal(ctx, cx, cy, 30*s, 45*s, angle, darker, rand, {rounded: true});
  }
  
  // 花心
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 18*s);

  grad.addColorStop(0.5, '#f0c640');
  grad.addColorStop(1, '#8a5018');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, 16*s, 0, Math.PI * 2);

  ctx.fillStyle = '#a86818';
  ctx.beginPath();
  ctx.arc(cx, cy, 4*s, 0, Math.PI * 2);
  ctx.fill();
}

// 19. 洋紫荆 - 5瓣兰花状
function drawBauhiniaCanvas(ctx, cx, cy, s, color, rand) {
  // 5 片细长瓣（上 1，左右各 2）
  const angles = [-Math.PI/2, -Math.PI/2 - 0.7, -Math.PI/2 + 0.7, -Math.PI/2 - 1.6, -Math.PI/2 + 1.6];
  const widths = [28, 32, 32, 35, 35];
  const heights = [110, 95, 95, 80, 80];
  
  for (let i = 0; i < 5; i++) {
    const angle = angles[i] + (rand()-0.5)*0.05;
    const colorVar = color.map(c => Math.max(0, Math.min(255, c + (rand()-0.5)*12)));
    watercolorPetal(ctx, cx, cy, widths[i]*s, heights[i]*s, angle, colorVar, rand, {tipPointed: true});
    
    // 中线
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.strokeStyle = `rgba(${colorVar[0]*0.5|0}, ${colorVar[1]*0.3|0}, ${colorVar[2]*0.4|0}, 0.55)`;
    ctx.lineWidth = 1.5*s;
    ctx.beginPath();
    ctx.moveTo(0, -5*s);
    ctx.lineTo(0, -heights[i]*s*0.9);
    ctx.stroke();
    ctx.restore();
  }
  
  // 花心
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 12*s);
  grad.addColorStop(0, `rgba(${color[0]*0.6|0}, ${color[1]*0.4|0}, ${color[2]*0.5|0}, 1)`);
  grad.addColorStop(1, `rgba(${color[0]*0.3|0}, ${color[1]*0.2|0}, ${color[2]*0.3|0}, 1)`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, 10*s, 0, Math.PI * 2);
  ctx.fill();
}

// 20. 兰花 - 国画风侧面观
function drawOrchidCanvas(ctx, cx, cy, s, color, rand) {
  // 上方萼片（朝上飘逸）
  watercolorPetal(ctx, cx, cy - 5*s, 18*s, 110*s, -Math.PI/2 - 0.05, color, rand, {tipPointed: true});
  // 左侧萼片
  watercolorPetal(ctx, cx, cy - 5*s, 18*s, 95*s, -Math.PI/2 - 1.3, color, rand, {tipPointed: true});
  // 右侧萼片
  watercolorPetal(ctx, cx, cy - 5*s, 18*s, 95*s, -Math.PI/2 + 1.3, color, rand, {tipPointed: true});
  // 左侧内瓣
  watercolorPetal(ctx, cx, cy - 5*s, 15*s, 70*s, -Math.PI/2 - 2.3, color, rand, {tipPointed: true});
  // 右侧内瓣
  watercolorPetal(ctx, cx, cy - 5*s, 15*s, 70*s, -Math.PI/2 + 2.3, color, rand, {tipPointed: true});
  
  // 下方唇瓣（兰花标志：心形）
  ctx.save();
  ctx.translate(cx, cy);
  const lipPath = new Path2D();
  lipPath.moveTo(-12*s, -5*s);
  lipPath.bezierCurveTo(-22*s, 10*s, -25*s, 45*s, -15*s, 65*s);
  lipPath.bezierCurveTo(-5*s, 75*s, 5*s, 75*s, 15*s, 65*s);
  lipPath.bezierCurveTo(25*s, 45*s, 22*s, 10*s, 12*s, -5*s);
  lipPath.closePath();
  
  const lighter = [Math.min(255, color[0]+30), Math.min(255, color[1]+30), Math.min(255, color[2]+30)];
  ctx.fillStyle = `rgba(${lighter[0]}, ${lighter[1]}, ${lighter[2]}, 0.55)`;
  ctx.fill(lipPath);
  
  ctx.save();
  ctx.clip(lipPath);
  for (let i = 0; i < 25; i++) {
    const px = (rand() - 0.5) * 50*s;
    const py = -10*s + rand() * 75*s;
    const grad = ctx.createRadialGradient(px, py, 0, px, py, 18*s);
    const v = (rand() - 0.5) * 25;
    grad.addColorStop(0, `rgba(${lighter[0]+v|0}, ${lighter[1]+v|0}, ${lighter[2]+v|0}, ${0.1 + rand()*0.1})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(-30*s, -10*s, 60*s, 80*s);
  }
  ctx.restore();
  
  // 唇瓣的红色斑点
  const spots = [[-9, 30], [10, 25], [-4, 50], [7, 55], [-13, 12]];
  for (const [dx, dy] of spots) {
    ctx.fillStyle = `rgba(${color[0]*0.4|0}, ${color[1]*0.25|0}, ${color[2]*0.3|0}, 0.85)`;
    ctx.beginPath();
    ctx.ellipse(dx*s, dy*s, 2.5*s, 3*s, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.lineWidth = 1*s;
  ctx.strokeStyle = `rgba(${color[0]*0.4|0}, ${color[1]*0.3|0}, ${color[2]*0.4|0}, 0.5)`;
  ctx.stroke(lipPath);
  ctx.restore();
  
  // 中央合蕊柱
  ctx.fillStyle = '#e8a830';
  ctx.beginPath();
  ctx.ellipse(cx, cy - 8*s, 5*s, 12*s, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#a86818';
  ctx.beginPath();
  ctx.arc(cx, cy - 12*s, 3*s, 0, Math.PI * 2);
  ctx.fill();
}

// 21. 格桑花 - 8瓣
function drawCosmosCanvas(ctx, cx, cy, s, color, rand) {
  // 8 瓣，瓣顶略凹
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2 - Math.PI/2 + (rand()-0.5)*0.05;
    const colorVar = color.map(c => Math.max(0, Math.min(255, c + (rand()-0.5)*15)));
    
    // 自定义带凹口的花瓣
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    const w = 28*s, h = 90*s;
    const petalPath = new Path2D();
    petalPath.moveTo(0, 0);
    petalPath.bezierCurveTo(-w*0.45, -h*0.15, -w*0.7, -h*0.55, -w*0.5, -h*0.85);
    petalPath.lineTo(-w*0.3, -h*0.95);
    petalPath.lineTo(-w*0.1, -h*0.85);
    petalPath.lineTo(0, -h*0.92);
    petalPath.lineTo(w*0.1, -h*0.85);
    petalPath.lineTo(w*0.3, -h*0.95);
    petalPath.lineTo(w*0.5, -h*0.85);
    petalPath.bezierCurveTo(w*0.7, -h*0.55, w*0.45, -h*0.15, 0, 0);
    petalPath.closePath();
    
    ctx.fillStyle = `rgba(${colorVar[0]}, ${colorVar[1]}, ${colorVar[2]}, 0.55)`;
    ctx.fill(petalPath);
    
    ctx.save();
    ctx.clip(petalPath);
    for (let j = 0; j < 22; j++) {
      const px = (rand() - 0.5) * w * 1.5;
      const py = -rand() * h;
      const grad = ctx.createRadialGradient(px, py, 0, px, py, w * 0.5);
      const cs = (rand() - 0.5) * 25;
      grad.addColorStop(0, `rgba(${colorVar[0]+cs|0}, ${colorVar[1]+cs|0}, ${colorVar[2]+cs|0}, ${0.1 + rand()*0.12})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(-w*1.5, -h*1.5, w*3, h*1.5);
    }
    ctx.restore();
    
    ctx.lineWidth = 1*s;
    ctx.strokeStyle = `rgba(${colorVar[0]*0.45|0}, ${colorVar[1]*0.45|0}, ${colorVar[2]*0.45|0}, 0.4)`;
    ctx.stroke(petalPath);
    ctx.restore();
  }
  
  // 黄花心
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 22*s);
  grad.addColorStop(0, '#fde88c');
  grad.addColorStop(0.6, '#f0c640');
  grad.addColorStop(1, '#7a4818');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, 20*s, 0, Math.PI * 2);
  ctx.fill();
  
  // 雄蕊点
  for (let i = 0; i < 12; i++) {
    const a = (i/12) * Math.PI * 2;
    const r = 14 * s;
    ctx.fillStyle = '#a86818';
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 2*s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#7a4818';
  ctx.beginPath();
  ctx.arc(cx, cy, 6*s, 0, Math.PI * 2);
  ctx.fill();
}

// 22. 马兰花 - 鸢尾，3上立 + 3下垂
function drawIrisCanvas(ctx, cx, cy, s, color, rand) {
  // 3 下垂瓣（较大）
  for (let i = 0; i < 3; i++) {
    const angle = (i / 3) * Math.PI * 2 + Math.PI/2;
    const colorVar = color.map(c => Math.max(0, Math.min(255, c + (rand()-0.5)*12)));
    watercolorPetal(ctx, cx, cy, 38*s, 100*s, angle, colorVar, rand, {rounded: true});
    
    // 黄色信号纹
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    const grad = ctx.createRadialGradient(0, -55*s, 0, 0, -55*s, 28*s);
    grad.addColorStop(0, 'rgba(240, 198, 64, 0.95)');
    grad.addColorStop(0.6, 'rgba(240, 198, 64, 0.4)');
    grad.addColorStop(1, 'rgba(240, 198, 64, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(0, -55*s, 9*s, 30*s, 0, 0, Math.PI * 2);
    ctx.fill();
    // 中脉
    ctx.strokeStyle = 'rgba(168, 104, 24, 0.65)';

    ctx.beginPath();
    ctx.moveTo(0, -8*s);
    ctx.lineTo(0, -90*s);
    ctx.stroke();

  }
  
  // 3 上立瓣（较窄）
  for (let i = 0; i < 3; i++) {

    const colorVar = color.map(c => Math.max(0, Math.min(255, c + (rand()-0.5)*12)));
    watercolorPetal(ctx, cx, cy, 25*s, 80*s, angle, colorVar, rand, {tipPointed: true});
  }
  
  // 中心
  ctx.fillStyle = `rgba(${color[0]*0.5|0}, ${color[1]*0.5|0}, ${color[2]*0.6|0}, 0.9)`;
  ctx.beginPath();
  ctx.arc(cx, cy, 10*s, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#e8a830';
  ctx.beginPath();
  ctx.arc(cx, cy, 5*s, 0, Math.PI * 2);
  ctx.fill();
}

// 颜色加深/变浅 (amt 为百分比, -100 到 100)
function shade(hex, amt) {
  let r = parseInt(hex.slice(1,3),16);
  let g = parseInt(hex.slice(3,5),16);
  let b = parseInt(hex.slice(5,7),16);
  if (amt > 0) {
    r = Math.min(255, r + Math.floor((255-r) * amt/100));
    g = Math.min(255, g + Math.floor((255-g) * amt/100));
    b = Math.min(255, b + Math.floor((255-b) * amt/100));
  } else {
    r = Math.max(0, r + Math.floor(r * amt/100));
    g = Math.max(0, g + Math.floor(g * amt/100));
    b = Math.max(0, b + Math.floor(b * amt/100));
  }
  return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
}

// 赏花点专用图片加载 - 优先搜地点名(中文维基),fallback 到植物名
const spotPhotoCache = {};
const spotPhotoPromises = {};

async function loadSpotPhoto(spot) {
  const cacheKey = spot.name;
  if (spotPhotoCache[cacheKey] !== undefined) return spotPhotoCache[cacheKey];
  if (spotPhotoPromises[cacheKey]) return spotPhotoPromises[cacheKey];
  
  spotPhotoPromises[cacheKey] = (async () => {
    // 1. 优先:中文维基搜地点名(最可能拿到"地点摄影"图)
    // 尝试几个候选名:完整名、去掉常见后缀
    const candidates = [spot.name];
    // 衍生候选 - 去掉"公园""花海""沟"等通用后缀,保留地标
    const stripped = spot.name.replace(/(公园|花海|花园|景区|大道|沟|村)$/, '');
    if (stripped && stripped !== spot.name && stripped.length >= 2) candidates.push(stripped);
    
    for (const candidate of candidates) {
      try {
        const wikiUrl = `https://zh.wikipedia.org/w/api.php?action=query&format=json&prop=pageimages&pithumbsize=1024&titles=${encodeURIComponent(candidate)}&origin=*&redirects=1`;
        const resp = await fetch(wikiUrl);
        if (resp.ok) {
          const data = await resp.json();
          const pages = data.query?.pages;
          if (pages) {
            const page = Object.values(pages)[0];
            const thumb = page?.thumbnail?.source;
            // 维基条目主图,且不是占位符
            if (thumb && !thumb.includes('Question_book') && !thumb.includes('Wiki_letter')) {
              const info = { square: thumb, medium: thumb, large: thumb, source: '中文维基 · ' + candidate };
              spotPhotoCache[cacheKey] = info;
              return info;
            }
          }
        }
      } catch (e) { /* try next */ }
    }
    
    // 2. fallback: 用植物拉丁名(已有的 loadFlowerPhoto 逻辑)
    const latin = TYPE_TO_LATIN[spot.type];
    if (latin) {
      try {
        const info = await loadFlowerPhoto(spot.type, latin);
        if (info) {
          spotPhotoCache[cacheKey] = info;
          return info;
        }
      } catch (e) { /* fail */ }
    }
    
    spotPhotoCache[cacheKey] = null;
    return null;
  })();
  
  return spotPhotoPromises[cacheKey];
}

function loadFlowerPhoto(type, latin) {
  if (photoCache[type]) return Promise.resolve(photoCache[type]);
  if (photoLoadPromises[type]) return photoLoadPromises[type];
  
  photoLoadPromises[type] = (async () => {
    // 优先 iNaturalist
    try {
      const apiUrl = `https://api.inaturalist.org/v1/taxa?q=${encodeURIComponent(latin)}&per_page=1`;
      const resp = await fetch(apiUrl, {
        headers: { 'Accept': 'application/json' },
        mode: 'cors'
      });
      if (resp.ok) {
        const data = await resp.json();
        const taxon = data.results?.[0];
        const photo = taxon?.default_photo;
        if (photo) {
          const square = photo.square_url || photo.url;
          const medium = photo.medium_url || (square ? square.replace('/square.', '/medium.') : null);
          const large = (medium ? medium.replace('/medium.', '/large.') : null) || medium;
          const info = { square, medium, large, taxon: taxon.id, source: 'iNaturalist' };
          photoCache[type] = info;
          return info;
        }
      }
    } catch (e) { /* iNat fail, try next */ }
    
    // Fallback: Wikimedia Commons - 通过 Wikipedia API 搜该拉丁名,取主图
    try {
      const wikiUrl = `https://en.wikipedia.org/w/api.php?action=query&format=json&prop=pageimages&pithumbsize=1024&titles=${encodeURIComponent(latin)}&origin=*`;
      const resp = await fetch(wikiUrl);
      if (resp.ok) {
        const data = await resp.json();
        const pages = data.query?.pages;
        if (pages) {
          const page = Object.values(pages)[0];
          const thumb = page?.thumbnail?.source;
          if (thumb) {
            const info = { square: thumb, medium: thumb, large: thumb, source: 'Wikimedia' };
            photoCache[type] = info;
            return info;
          }
        }
      }
    } catch (e) { /* wiki fail */ }
    
    photoCache[type] = null;
    return null;
  })();
  
  return photoLoadPromises[type];
}

// 生成水彩纸张纹理 —— 在客户端用 canvas 生成 PNG data URL,设到背景
function generatePaperTextures() {
  // 第 1 层：细密纸纤维颗粒(柔和)
  const c1 = document.createElement('canvas');
  const size1 = 300;
  c1.width = size1; c1.height = size1;
  const ctx1 = c1.getContext('2d');
  const imgData = ctx1.createImageData(size1, size1);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const v = Math.random();
    if (v < 0.75) {
      // 极淡颗粒(占多数)
      data[i] = 200; data[i+1] = 175; data[i+2] = 130;
      data[i+3] = Math.random() * 8;
    } else if (v < 0.96) {
      // 中等颗粒
      data[i] = 165; data[i+1] = 130; data[i+2] = 80;
      data[i+3] = Math.random() * 18;
    } else {
      // 偶尔深色小点(稀疏)
      data[i] = 120; data[i+1] = 88; data[i+2] = 50;
      data[i+3] = 20 + Math.random() * 25;
    }
  }
  ctx1.putImageData(imgData, 0, 0);
  // 几条纸纤维线(更稀疏)
  ctx1.strokeStyle = 'rgba(140, 100, 60, 0.07)';
  ctx1.lineWidth = 0.4;
  for (let i = 0; i < 35; i++) {
    const x1 = Math.random() * size1;
    const y1 = Math.random() * size1;
    const len = 25 + Math.random() * 70;
    const ang = Math.random() * Math.PI * 2;
    ctx1.beginPath();
    ctx1.moveTo(x1, y1);
    ctx1.quadraticCurveTo(
      x1 + Math.cos(ang)*len*0.5 + (Math.random()-0.5)*5,
      y1 + Math.sin(ang)*len*0.5 + (Math.random()-0.5)*5,
      x1 + Math.cos(ang)*len,
      y1 + Math.sin(ang)*len
    );
    ctx1.stroke();
  }
  document.querySelectorAll('.paper-texture').forEach(el => {
    el.style.backgroundImage = `url(${c1.toDataURL('image/png')})`;
  });
  
  // 第 2 层：大尺度水彩湿斑(更柔和,更多层次)
  const c2 = document.createElement('canvas');
  const size2 = 700;
  c2.width = size2; c2.height = size2;
  const ctx2 = c2.getContext('2d');
  ctx2.fillStyle = 'rgba(245, 230, 200, 1)';
  ctx2.fillRect(0, 0, size2, size2);
  // 大色块湿斑 - 增加数量,更柔和
  for (let i = 0; i < 50; i++) {
    const x = Math.random() * size2;
    const y = Math.random() * size2;
    const r = 60 + Math.random() * 220;
    const grad = ctx2.createRadialGradient(x, y, 0, x, y, r);
    const tone = Math.random();
    if (tone < 0.3) {
      grad.addColorStop(0, `rgba(195, 165, 110, ${0.12 + Math.random()*0.18})`);
    } else if (tone < 0.65) {
      grad.addColorStop(0, `rgba(230, 205, 155, ${0.15 + Math.random()*0.15})`);
    } else if (tone < 0.85) {
      grad.addColorStop(0, `rgba(175, 145, 95, ${0.08 + Math.random()*0.12})`);
    } else {
      grad.addColorStop(0, `rgba(245, 220, 175, ${0.18 + Math.random()*0.15})`);
    }
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx2.fillStyle = grad;
    ctx2.fillRect(0, 0, size2, size2);
  }
  document.querySelectorAll('.paper-texture-watercolor').forEach(el => {
    el.style.backgroundImage = `url(${c2.toDataURL('image/png')})`;
  });
}

  // 预计算每个城市到最近邻居的距离 -- 用于动态调整撒花范围
  const cityNeighborDist = {};
  const allCoords = Object.entries(CITY_FLOWERS)
    .map(([n]) => ({name: n, coord: cityMap[n]}))
    .filter(c => c.coord);
  for (const a of allCoords) {
    let minD = Infinity;
    for (const b of allCoords) {
      if (a.name === b.name) continue;
      const d = Math.hypot(a.coord.x - b.coord.x, a.coord.y - b.coord.y);
      if (d < minD) minD = d;
    }
    cityNeighborDist[a.name] = minD;
  }

  Object.entries(CITY_FLOWERS).forEach(([cityName, info]) => {
    const coord = cityMap[cityName];
    if (!coord) return;

    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'city-dot');
    g.setAttribute('data-city', cityName);
    g.setAttribute('transform', `translate(${coord.x}, ${coord.y})`);

    // 选第一朵花作为绽放展示
    const mainFlower = info.flowers[0];
    
    // 主花簇尺寸（正方形，锚点居中）
    const plantSize = 48;
    const plantURL = getPlantSpriteURL(mainFlower.type, mainFlower.color, plantSize, plantSize, 0);
    
    // 根据到最近邻居的距离动态调整撒花范围
    // 邻居越近(密集城市群),撒花半径越小、数量越少
    const neighborDist = cityNeighborDist[cityName] || 100;
    // 撒花半径 ≈ 邻居距离的 30% (避免重叠)
    const maxScatterRadius = Math.max(14, Math.min(40, neighborDist * 0.32));
    // 密集区域少撒,稀疏区域多撒
    const isDense = neighborDist < 35;
    const scatterCount = isDense ? 4 : (neighborDist < 60 ? 7 : 10);
    
    // 周围撒落的小花田装饰
    let scatterHTML = '';
    let nameSeed = 0;
    for (let i = 0; i < cityName.length; i++) nameSeed = (nameSeed*31 + cityName.charCodeAt(i)) | 0;
    const scatRand = mulberry32(nameSeed);
    for (let i = 0; i < scatterCount; i++) {
      const angle = scatRand() * Math.PI * 2;
      // 距离分两层
      const halfPoint = Math.ceil(scatterCount / 2);
      const isOuter = i >= halfPoint;
      const innerR = maxScatterRadius * 0.4;
      const outerR = maxScatterRadius;
      const dist = isOuter 
        ? innerR * 1.2 + scatRand() * (outerR - innerR * 1.2)
        : 8 + scatRand() * (innerR - 8);
      const sx = Math.cos(angle) * dist;
      const sy = Math.sin(angle) * dist * 0.7;
      // 密集区花更小
      const sizeBase = isDense ? 0.32 : (neighborDist < 60 ? 0.40 : 0.48);
      const ssize = isOuter ? sizeBase + scatRand() * 0.20 : sizeBase + 0.10 + scatRand() * 0.22;
      const sSize = Math.round(plantSize * ssize);
      const variant = i + 1;
      const surl = getPlantSpriteURL(mainFlower.type, mainFlower.color, sSize, sSize, variant);
      scatterHTML += `<image class="scatter-flower" href="${surl}" x="${sx - sSize/2}" y="${sy - sSize/2}" width="${sSize}" height="${sSize}" style="--sway-delay: ${(i*0.3).toFixed(2)}s; --sway-origin: ${sx}px ${sy + sSize/2}px;"/>`;
    }
    
    // 密集区主花也略缩小,避免互相挤
    const mainPlantSize = isDense ? Math.round(plantSize * 0.75) : plantSize;
    
    // 主花的诗句 (从 FLOWER_INFO 取)
    const ext = FLOWER_INFO[mainFlower.type] || {};
    // 提取一句诗(取第一句,以"。"、","、"、"分割)
    let firstLine = '';
    if (ext.poem) {
      firstLine = ext.poem.split(/[。，、]/)[0];
    }
    
    g.innerHTML = `
      <circle class="hitarea" r="24" fill="transparent"/>
      ${scatterHTML}
      <g class="flower-group" id="flower-${cityName}">
        <image class="map-flower-img" href="${plantURL}" x="${-mainPlantSize/2}" y="${-mainPlantSize/2}" width="${mainPlantSize}" height="${mainPlantSize}" data-type="${mainFlower.type}" data-latin="${mainFlower.latin}"/>
      </g>
    `;
    // 存诗句到 dataset 供 hover tooltip 用
    g.dataset.poem = firstLine;
    g.dataset.flowerName = mainFlower.name;
    cityLayer.appendChild(g);
    
    // 异步加载真照片（覆盖在植株顶端做花头的精细照片层 —— 可选，这里保留原逻辑但不替换植株）
    // 注：因为植株风格已经统一，照片替换会破坏视觉，所以这里仅保留 photo 给侧边卡片用
    loadFlowerPhoto(mainFlower.type, mainFlower.latin);

    // 标签（放在独立层，确保在花朵上方）
    // 用 <g> 包裹：透明矩形（大热区） + 文字（可见）
    const labelGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    labelGroup.setAttribute('class', 'city-label-group');
    labelGroup.setAttribute('data-city', cityName);

    const labelOffset = getLabelOffset(cityName, coord);
    const labelX = coord.x + labelOffset.dx;
    const labelY = coord.y + labelOffset.dy;

    // 透明热区矩形（扩大点击范围）
    const textWidth = cityName.length * 13 + 6; // 估算文字宽度
    const textHeight = 18;
    const rectX = labelOffset.anchor === 'end' ? labelX - textWidth + 3 :
                  labelOffset.anchor === 'middle' ? labelX - textWidth/2 :
                  labelX - 3;
    const hitRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    hitRect.setAttribute('class', 'label-hitarea');
    hitRect.setAttribute('x', rectX);
    hitRect.setAttribute('y', labelY - 12);
    hitRect.setAttribute('width', textWidth);
    hitRect.setAttribute('height', textHeight);
    hitRect.setAttribute('fill', 'transparent');
    labelGroup.appendChild(hitRect);

    // 可见文字
    const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    label.setAttribute('class', 'city-label');
    label.setAttribute('x', labelX);
    label.setAttribute('y', labelY);
    label.setAttribute('text-anchor', labelOffset.anchor);
    label.setAttribute('data-city', cityName);
    label.textContent = cityName;
    labelGroup.appendChild(label);

    labelLayer.appendChild(labelGroup);

    g.addEventListener('click', (e) => {
      e.stopPropagation();
      selectCity(cityName);
    });
    labelGroup.addEventListener('click', (e) => {
      e.stopPropagation();
      selectCity(cityName);
    });
    labelGroup.style.cursor = 'pointer';
  });

  // =========================================================================
  // 渲染赏花点(在 spotLayer 里,默认隐藏)
  // =========================================================================
  const spotLayer = document.getElementById('spotLayer');
  // 按城市分组,这样同城市的赏花点围绕该城市散开
  const spotsByCity = {};
  FLOWER_SPOTS.forEach((s, idx) => {
    if (!spotsByCity[s.city]) spotsByCity[s.city] = [];
    spotsByCity[s.city].push({...s, _idx: idx});
  });
  
  for (const [cityName, spots] of Object.entries(spotsByCity)) {
    const cityCoord = cityMap[cityName];
    if (!cityCoord) continue;
    
    spots.forEach((spot, localIdx) => {
      let sx, sy;
      
      if (spot.offset) {
        // 手动指定精确偏移(SVG 坐标单位,正值向右/下)
        sx = cityCoord.x + spot.offset[0];
        sy = cityCoord.y + spot.offset[1];
      } else {
        // 自动散布:用稳定种子 + 紧凑半径(避免赏花点跑出城市辖区)
        let seed = spot._idx * 7919;
        for (let i = 0; i < spot.name.length; i++) seed = (seed * 31 + spot.name.charCodeAt(i)) | 0;
        const r2 = mulberry32(seed);
        
        // 紧凑散布:即使一个城市有 10 个点,半径也不超过约 25
        const baseDist = 6 + spots.length * 1.5;
        const ang = (localIdx / spots.length) * Math.PI * 2 + r2() * 0.5;
        const dist = baseDist + r2() * 8;
        sx = cityCoord.x + Math.cos(ang) * dist;
        sy = cityCoord.y + Math.sin(ang) * dist * 0.75;
      }
      
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'spot-marker');
      g.setAttribute('data-spot-idx', spot._idx);
      g.setAttribute('data-spot-name', spot.name);
      g.setAttribute('transform', `translate(${sx}, ${sy})`);
      
      // 赏花点 marker - 鲜亮色 + 大尺寸,与背景的市花层区分
      const spotSize = 44;
      const spotURL = getPlantSpriteURLVivid(spot.type, spot.color, spotSize, spotSize, spot._idx);
      
      g.innerHTML = `
        <circle class="spot-hitarea" r="20" fill="transparent"/>
        <image class="spot-flower" href="${spotURL}" x="${-spotSize/2}" y="${-spotSize/2}" width="${spotSize}" height="${spotSize}" data-type="${spot.type}"/>
      `;
      // 用于 hover / tooltip
      g.dataset.poem = spot.poetic || '';
      g.dataset.flowerName = spot.flower;
      g.dataset.spotFullName = spot.name;
      spotLayer.appendChild(g);
      
      g.addEventListener('click', (e) => {
        e.stopPropagation();
        selectSpot(spot._idx);
      });
      g.style.cursor = 'pointer';
    });
  }

  initMonths();
  updateBlooms();
  initMobileSheet();
}

// 移动端：底部抽屉的展开/收起 + 触摸拖拽
function initMobileSheet() {
  const sidebar = document.querySelector('.sidebar');
  if (!sidebar) return;
  const head = sidebar.querySelector('.sidebar-head');
  if (!head) return;
  
  // 点击头部切换展开状态
  head.addEventListener('click', (e) => {
    // 只在手机端响应（避免桌面端被影响）
    if (window.innerWidth > 700) return;
    e.stopPropagation();
    
    if (sidebar.classList.contains('expanded')) {
      sidebar.classList.remove('expanded');
    } else if (sidebar.classList.contains('has-content')) {
      sidebar.classList.add('expanded');
    }
  });
  
  // 触摸拖拽：向下拖关闭，向上拖展开
  let startY = null, startTransform = null, dragging = false;
  
  head.addEventListener('touchstart', (e) => {
    if (window.innerWidth > 700) return;
    startY = e.touches[0].clientY;
    dragging = true;
    sidebar.style.transition = 'none';
  }, {passive: true});
  
  head.addEventListener('touchmove', (e) => {
    if (!dragging || window.innerWidth > 700) return;
    const dy = e.touches[0].clientY - startY;
    const max = sidebar.offsetHeight - 56;
    
    if (sidebar.classList.contains('expanded')) {
      // 展开状态：dy > 0 表示往下拉
      if (dy > 0) {
        sidebar.style.transform = `translateY(${Math.min(dy, max)}px)`;
      }
    } else {
      // 收起状态：dy < 0 表示往上拉
      if (dy < 0) {
        const offset = Math.max(max + dy, 0);
        sidebar.style.transform = `translateY(${offset}px)`;
      }
    }
  }, {passive: true});
  
  head.addEventListener('touchend', (e) => {
    if (!dragging || window.innerWidth > 700) return;
    dragging = false;
    sidebar.style.transition = '';
    sidebar.style.transform = '';
    
    const endY = e.changedTouches[0].clientY;
    const dy = endY - startY;
    
    // 阈值：拖超过 60px 切换状态
    if (sidebar.classList.contains('expanded') && dy > 60) {
      sidebar.classList.remove('expanded');
    } else if (!sidebar.classList.contains('expanded') && dy < -60) {
      sidebar.classList.add('expanded');
    }
  }, {passive: true});
}

function initMonths() {
  const container = document.getElementById('months');
  for (let m = 1; m <= 12; m++) {
    const btn = document.createElement('button');
    btn.className = 'month-btn' + (m === currentMonth ? ' active' : '');
    btn.innerHTML = `<span class="num">${monthRoman[m]}</span>${monthNames[m]}`;
    btn.addEventListener('click', () => {
      currentMonth = m;
      document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateBlooms();
      // 月份切换时刷新右侧（如有选中城市），保留花朵开放状态
      if (selectedCity) {
        const flower = document.getElementById(`flower-${selectedCity}`);
        selectCity(selectedCity);
        // 确保选中城市的花保持开放
        if (flower && !flower.classList.contains('open')) {

        }
      }
    });

}

function getSeason(month) {
  if (month >= 3 && month <= 5) return 'spring';
  if (month >= 6 && month <= 8) return 'summer';
  if (month >= 9 && month <= 11) return 'autumn';
  return 'winter';
}

function applySeason(month) {
  const mapFrame = document.querySelector('.map-frame');
  if (mapFrame) mapFrame.setAttribute('data-season', getSeason(month));
  // 启动 / 切换飘落动画
  if (typeof updateFloatingPetals === 'function') {
    updateFloatingPetals(getSeason(month));
  }
}

// =========================================================================
// 季节飘落动画 - 春落花瓣、秋落叶、冬落雪
// =========================================================================
let petalCanvas = null;
let petalCtx = null;
let petalRaf = null;
let petalSeason = null;
let petals = [];

function initFloatingPetals() {
  petalCanvas = document.createElement('canvas');
  petalCanvas.className = 'season-petals';
  petalCanvas.style.cssText = `
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 50;
    opacity: 0;
    transition: opacity 1.2s ease;
  `;
  document.body.appendChild(petalCanvas);
  petalCtx = petalCanvas.getContext('2d');
  
  const resize = () => {
    const dpr = window.devicePixelRatio || 1;
    petalCanvas.width = window.innerWidth * dpr;
    petalCanvas.height = window.innerHeight * dpr;
    petalCtx.scale(dpr, dpr);
  };
  resize();
  window.addEventListener('resize', resize);
  
  // 用户偏好:减少动画的话不启用
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return;
  }
  
  // 启动动画循环
  function tick() {
    if (!petalSeason || petals.length === 0) {
      petalRaf = null;
      return;
    }
    petalCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    for (let i = petals.length - 1; i >= 0; i--) {
      const p = petals[i];
      drawPetal(petalCtx, p);
      stepPetal(p);
      // 出屏 → 从顶部重新出现
      if (p.y > window.innerHeight + 50) {
        p.y = -50 - Math.random() * 100;
        p.x = Math.random() * window.innerWidth;
        p.life = 0;
      }
    }
    petalRaf = requestAnimationFrame(tick);
  }
  petalRaf = requestAnimationFrame(tick);
}

function updateFloatingPetals(season) {
  if (!petalCanvas) return;
  if (season === petalSeason) return;
  petalSeason = season;
  
  // 夏季不显示
  if (season === 'summer') {
    petalCanvas.style.opacity = '0';
    petals = [];
    return;
  }
  
  // 重新生成粒子
  const count = window.innerWidth < 700 ? 10 : 18;
  petals = [];
  for (let i = 0; i < count; i++) {
    petals.push(createPetal(season, true));
  }
  petalCanvas.style.opacity = '1';
  
  if (!petalRaf) {
    function tick() {
      if (!petalSeason || petals.length === 0) {
        petalRaf = null;
        return;
      }
      petalCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (let i = petals.length - 1; i >= 0; i--) {
        const p = petals[i];
        drawPetal(petalCtx, p);
        stepPetal(p);
        if (p.y > window.innerHeight + 50) {
          p.y = -50 - Math.random() * 100;
          p.x = Math.random() * window.innerWidth;
          p.life = 0;
        }
      }
      petalRaf = requestAnimationFrame(tick);
    }
    petalRaf = requestAnimationFrame(tick);
  }
}

function createPetal(season, randomY) {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const p = {
    x: Math.random() * w,
    y: randomY ? Math.random() * h : -30 - Math.random() * 80,
    vx: 0,
    vy: 0.4 + Math.random() * 0.8,
    rot: Math.random() * Math.PI * 2,
    vRot: (Math.random() - 0.5) * 0.04,
    size: 0,
    type: '',
    color: '',
    life: 0,
    swing: Math.random() * Math.PI * 2,
    swingSpeed: 0.015 + Math.random() * 0.02,
    swingAmp: 0.5 + Math.random() * 1.0
  };
  
  if (season === 'spring') {
    // 桃/樱花瓣 - 粉色
    p.type = 'petal';
    p.size = 7 + Math.random() * 7;
    const colors = ['#f5b8c8', '#f0a4b8', '#f8c8d4', '#e8a0b8'];
    p.color = colors[Math.floor(Math.random() * colors.length)];
    p.vy = 0.3 + Math.random() * 0.6;
  } else if (season === 'autumn') {
    // 落叶 - 银杏(金黄) + 枫叶(橙红)
    const useGinkgo = Math.random() < 0.6;
    p.type = useGinkgo ? 'ginkgo' : 'maple';
    p.size = 10 + Math.random() * 8;
    if (useGinkgo) {
      const colors = ['#e8c440', '#dab030', '#f0d060'];
      p.color = colors[Math.floor(Math.random() * colors.length)];
    } else {
      const colors = ['#d04a2a', '#c63820', '#e85a3a'];
      p.color = colors[Math.floor(Math.random() * colors.length)];
    }
    p.vy = 0.5 + Math.random() * 0.7;
  } else if (season === 'winter') {
    // 冬:雪花 + 偶尔的梅花瓣
    const useSnow = Math.random() < 0.8;
    p.type = useSnow ? 'snow' : 'plum';
    if (useSnow) {
      p.color = `rgba(255, 255, 255, ${0.7 + Math.random() * 0.3})`;
    } else {
      p.color = '#c84a72';
    }
    p.size = useSnow ? (5 + Math.random() * 5) : (6 + Math.random() * 4);
    p.vy = useSnow ? (0.4 + Math.random() * 0.5) : (0.4 + Math.random() * 0.5);
    p.vRot = (Math.random() - 0.5) * 0.015; // 雪花更慢的旋转,看清形状
    p.swingAmp = useSnow ? 0.6 : 0.8;
  }
  return p;
}

function stepPetal(p) {
  p.life++;
  p.swing += p.swingSpeed;
  p.vx = Math.sin(p.swing) * p.swingAmp;
  p.x += p.vx;
  p.y += p.vy;
  p.rot += p.vRot;
}

function drawPetal(ctx, p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);
  
  if (p.type === 'petal') {
    // 樱/桃花瓣 - 椭圆形带尖端凹口
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.moveTo(0, -p.size);
    ctx.bezierCurveTo(p.size*0.7, -p.size*0.5, p.size*0.5, p.size*0.5, 0, p.size);
    ctx.bezierCurveTo(-p.size*0.5, p.size*0.5, -p.size*0.7, -p.size*0.5, 0, -p.size);
    ctx.fill();
    // 中心瓣脉
    ctx.strokeStyle = `rgba(180, 100, 130, 0.4)`;
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(0, -p.size*0.8);
    ctx.lineTo(0, p.size*0.8);
    ctx.stroke();
  } else if (p.type === 'ginkgo') {
    // 银杏扇形叶
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 0.85;
    const s = p.size;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-s*0.5, -s*0.2, -s*0.7, -s*0.7, -s*0.15, -s*0.95);
    ctx.lineTo(0, -s*0.85);
    ctx.lineTo(s*0.15, -s*0.95);
    ctx.bezierCurveTo(s*0.7, -s*0.7, s*0.5, -s*0.2, 0, 0);
    ctx.closePath();
    ctx.fill();
    // 叶脉
    ctx.strokeStyle = `rgba(120, 80, 30, 0.4)`;
    ctx.lineWidth = 0.5;
    for (let i = -2; i <= 2; i++) {
      const ang = -Math.PI/2 + i * 0.25;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(ang) * s * 0.8, Math.sin(ang) * s * 0.8);
      ctx.stroke();
    }
  } else if (p.type === 'maple') {
    // 枫叶 - 简化掌状
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 0.85;
    const s = p.size;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI/2 + (i - 2) * 0.5;
      const r = i === 2 ? s : (Math.abs(i-2) === 1 ? s*0.85 : s*0.65);
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y);
      else {
        const mid = -Math.PI/2 + (i - 2.5) * 0.5;
        ctx.lineTo(Math.cos(mid) * s * 0.3, Math.sin(mid) * s * 0.3);
        ctx.lineTo(x, y);
      }
    }
    ctx.closePath();
    ctx.fill();
  } else if (p.type === 'snow') {
    // 雪花 - 6 角分形,带羽状小分支,柔光晕
    const s = p.size;
    
    // 外层光晕(柔和扩散)
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 2.2);
    glow.addColorStop(0, 'rgba(255, 255, 255, 0.35)');
    glow.addColorStop(0.5, 'rgba(255, 255, 255, 0.12)');
    glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, s * 2.2, 0, Math.PI * 2);
    ctx.fill();
    
    // 6 条主臂 + 分支(羽状)
    ctx.strokeStyle = `rgba(255, 255, 255, 0.9)`;
    ctx.lineWidth = 0.8;
    ctx.lineCap = 'round';
    
    for (let i = 0; i < 6; i++) {
      ctx.save();
      ctx.rotate((i / 6) * Math.PI * 2);
      
      // 主臂
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -s * 1.8);
      ctx.stroke();
      
      // 主臂上 2-3 对小分支(分形)
      const branchPositions = [0.4, 0.7];
      for (const bp of branchPositions) {
        const by = -s * 1.8 * bp;
        const blen = s * 0.5 * (1 - bp * 0.4);  // 越靠尖端的分支越短
        // 左侧分支
        ctx.beginPath();
        ctx.moveTo(0, by);
        ctx.lineTo(-blen * 0.7, by - blen * 0.5);
        ctx.stroke();
        // 右侧分支
        ctx.beginPath();
        ctx.moveTo(0, by);
        ctx.lineTo(blen * 0.7, by - blen * 0.5);
        ctx.stroke();
      }
      
      // 主臂尖端的小三叉
      const tipY = -s * 1.8;
      const tipLen = s * 0.3;
      ctx.beginPath();
      ctx.moveTo(0, tipY);
      ctx.lineTo(-tipLen * 0.5, tipY + tipLen * 0.3);
      ctx.moveTo(0, tipY);
      ctx.lineTo(tipLen * 0.5, tipY + tipLen * 0.3);
      ctx.stroke();
      
      ctx.restore();
    }
    
    // 中心小亮点
    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
    ctx.beginPath();
    ctx.arc(0, 0, s * 0.18, 0, Math.PI * 2);
    ctx.fill();
  } else if (p.type === 'plum') {
    // 梅花瓣
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 0.85;
    const s = p.size;
    // 5 瓣
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      ctx.save();
      ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(0, -s*0.5, s*0.4, s*0.55, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}

// 花信送达 — 月份切换时的小动画提示
function triggerMonthMessenger() {
  const sidebarHead = document.querySelector('.sidebar-head');
  if (!sidebarHead) return;
  sidebarHead.classList.remove('messenger-arrived');
  void sidebarHead.offsetWidth;
  sidebarHead.classList.add('messenger-arrived');
}

function updateBlooms() {
  // 季节配色随月份切换
  applySeason(currentMonth);
  
  let bloomCount = 0;
  const provincesWithBloom = new Set();
  
  // 收集所有城市并按"花信路径"排序 —— 从南到北、从东到西,模拟花信由暖至寒、由海至陆的传递路径
  // 实现方式:按城市经纬度计算一个"信使顺序"
  const cityList = Object.entries(CITY_FLOWERS).map(([cityName, info]) => {
    const coord = (window.cityMap && window.cityMap[cityName]) || {x: 500, y: 360};
    return {cityName, info, coord};
  });
  // 按纬度 + 经度排序:y 越大越南(画面下),先开;同纬度时 x 越小越东
  // 实际 SVG y 轴向下,所以"南方"y 大,"北方"y 小
  // 春夏(3-8月) 花信由南向北;秋冬(9-2月) 由北向南
  const isNorthbound = currentMonth >= 3 && currentMonth <= 8;
  cityList.sort((a, b) => {
    if (isNorthbound) {
      // 南到北 = y 大到小
      return b.coord.y - a.coord.y || a.coord.x - b.coord.x;
    } else {
      // 北到南 = y 小到大
      return a.coord.y - b.coord.y || b.coord.x - a.coord.x;
    }
  });
  
  // 收集本月将要"开"和"谢"的城市,分别排序后 stagger
  const willBloom = [], willWilt = [];
  cityList.forEach((c, idx) => {
    const dot = document.querySelector(`.city-dot[data-city="${c.cityName}"]`);
    if (!dot) return;
    const flower = document.getElementById(`flower-${c.cityName}`);
    const label = document.querySelector(`.city-label[data-city="${c.cityName}"]`);
    if (!flower) return;
    
    const isBloom = c.info.flowers.some(f => f.months.includes(currentMonth));
    const wasBloom = flower.classList.contains('open');
    
    if (isBloom) {
      provincesWithBloom.add(c.info.province);
      bloomCount++;
      if (!wasBloom) {
        willBloom.push({...c, dot, flower, label});
      } else {
        // 已开 → 保持
        dot.classList.add('blooming');
        label && label.classList.add('bloom');
      }
    } else {
      if (wasBloom) {
        willWilt.push({...c, dot, flower, label});
      } else {
        dot.classList.remove('blooming');
        label && label.classList.remove('bloom');
      }
    }
  });
  
  // 先让该谢的快速谢
  willWilt.forEach((c, i) => {
    const delay = i * 35; // 凋零稍快
    setTimeout(() => {
      c.flower.classList.remove('open');
      c.flower.classList.add('wilting');
      c.dot.classList.remove('blooming');
      c.label && c.label.classList.remove('bloom');
      setTimeout(() => c.flower.classList.remove('wilting'), 700);
    }, delay);
  });
  
  // 然后让新开的"花信送达" — 按地理顺序 stagger
  const bloomStartDelay = willWilt.length > 0 ? 200 : 0; // 等谢完一会儿再开
  willBloom.forEach((c, i) => {
    const delay = bloomStartDelay + i * 80; // 80ms 一个,更有节奏感
    setTimeout(() => {
      c.flower.classList.remove('wilting');
      c.dot.classList.add('blooming');
      c.label && c.label.classList.add('bloom');
      c.flower.classList.remove('open');
      void c.flower.offsetWidth;
      c.flower.classList.add('open');
    }, delay);
  });
  
  // 触发月份指示器的"花信送达"动画
  triggerMonthMessenger();
  
  // 同步更新赏花点的盛放状态
  if (typeof updateSpotBlooms === 'function') updateSpotBlooms();

  // 高亮有花的省份（平滑切换）
  document.querySelectorAll('.province').forEach(p => {
    if (provincesWithBloom.has(p.dataset.name)) {
      p.classList.add('has-bloom');
    } else {
      p.classList.remove('has-bloom');
    }
  });

  // 月份显示总是更新（在头部，不会被清除）
  const monthDisp = document.getElementById('monthDisplay');
  if (monthDisp) monthDisp.textContent = `№ ${monthRoman[currentMonth]} · ${String(currentMonth).padStart(2,'0')}`;
  const curM = document.getElementById('currentMonth');
  if (curM) curM.textContent = monthNames[currentMonth];
  const bc = document.getElementById('bloomCount');
  if (bc) bc.textContent = `${bloomCount} cities blooming`;
}

// 选中赏花点 - 显示侧边详情卡

let selectedSpotIdx = null;

function selectSpot(idx) {

  const isOn = spot.months.includes(currentMonth);
  const monthsText = spot.months.map(m => monthNames[m]).join('、');
  
  // 给意境画一个 canvas 占位
  const canvasId = `spot-canvas-${idx}`;
  
  const body = document.getElementById('sidebarBody');
  if (!body) return;
  
  body.innerHTML = `
    <div class="spot-card">
      <div class="spot-card-tag">${spot.region || spot.city} · 赏花胜地</div>
      <div class="spot-name">${spot.name}</div>
      <div class="spot-flower-line">
        <span class="spot-flower-name">${spot.flower}</span>
        <span class="spot-best-time ${isOn ? 'on' : 'off'}">${isOn ? '★ 当下盛放' : '· 此时未开'}</span>
      </div>
      
      <div class="spot-scene-wrap" id="spot-scene-${idx}">
        <canvas class="spot-scene-canvas" id="${canvasId}" width="380" height="240"></canvas>
        <img class="spot-scene-photo" id="spot-photo-${idx}" alt="${spot.name}实拍照片" loading="lazy"/>
        <div class="spot-scene-loading" id="spot-loading-${idx}">载入照片…</div>
        <div class="spot-poetic">${spot.poetic}</div>
        <button class="spot-scene-toggle" data-mode="painting" data-spot-idx="${idx}" title="切换照片">
          <span class="toggle-icon">📷</span>
          <span class="toggle-text">实景</span>
        </button>
        <button class="spot-scene-upload" data-spot-idx="${idx}" title="换一张自定义图片">
          <span class="upload-icon">✏️</span>
        </button>
        <button class="spot-scene-export" data-spot-idx="${idx}" title="导出代码,让所有人看到这张图">
          <span class="export-icon">📋</span>
        </button>
        <input type="file" class="spot-file-input" id="spot-file-${idx}" accept="image/*" style="display:none"/>
      </div>
      
      <div class="spot-best-period">
        <div class="period-label">最佳观赏期</div>
        <div class="period-value">${spot.bestTime}</div>
        <div class="period-months">花期 · ${monthsText}</div>
      </div>
      
      <div class="spot-notes">${spot.notes}</div>
      
      <div class="spot-info-grid">
        <div class="info-row">
          <span class="info-icon">📍</span>
          <div>
            <div class="info-label">地址</div>
            <div class="info-value">${spot.address}</div>
          </div>
        </div>
        <div class="info-row">
          <span class="info-icon">🚇</span>
          <div>
            <div class="info-label">交通</div>
            <div class="info-value">${spot.transport}</div>
          </div>
        </div>
        <div class="info-row">
          <span class="info-icon">🎫</span>
          <div>
            <div class="info-label">门票</div>
            <div class="info-value">${spot.ticket}</div>
          </div>
        </div>
        <div class="info-row">
          <span class="info-icon">🕐</span>
          <div>
            <div class="info-label">开放时间</div>
            <div class="info-value">${spot.hours}</div>
          </div>
        </div>
      </div>
    </div>
  `;
  
  // 异步绘制水彩意境画
  setTimeout(() => {
    const canvas = document.getElementById(canvasId);
    if (canvas) drawSpotScene(canvas, spot);
    
    // 绑定切换按钮
    const toggleBtn = document.querySelector(`.spot-scene-toggle[data-spot-idx="${idx}"]`);
    const wrap = document.getElementById(`spot-scene-${idx}`);
    const photoEl = document.getElementById(`spot-photo-${idx}`);
    const loadingEl = document.getElementById(`spot-loading-${idx}`);
    const uploadBtn = document.querySelector(`.spot-scene-upload[data-spot-idx="${idx}"]`);
    const fileInput = document.getElementById(`spot-file-${idx}`);
    if (!toggleBtn || !wrap || !photoEl) return;
    
    let photoLoaded = false;
    let photoUrl = null;
    
    // 优先级:SPOT_CUSTOM_IMAGES(永久内嵌) > localStorage(本地临时)
    const customKey = `spot-custom-${spot.name}`;
    const embeddedImage = SPOT_CUSTOM_IMAGES[spot.name];
    const localImage = localStorage.getItem(customKey);
    const customImage = embeddedImage || localImage;
    
    if (customImage) {
      // 已有自定义图片 - 直接预设
      photoUrl = customImage;
      photoEl.src = customImage;
      photoEl.onload = () => photoEl.classList.add('loaded');
      photoLoaded = true;
      // 上传按钮显示"已自定义"状态
      uploadBtn.classList.add('has-custom');
      if (embeddedImage) {
        uploadBtn.classList.add('is-embedded');
        uploadBtn.title = '已为所有人保存 · 点击替换';
      } else {
        uploadBtn.title = '点击换图,长按恢复默认';
      }
    }
    
    toggleBtn.addEventListener('click', async () => {
      const mode = toggleBtn.dataset.mode;
      if (mode === 'painting') {
        // 切换到照片
        wrap.classList.add('show-photo');
        toggleBtn.dataset.mode = 'photo';
        toggleBtn.querySelector('.toggle-icon').textContent = '🎨';
        toggleBtn.querySelector('.toggle-text').textContent = '画意';
        
        // 第一次点击时加载照片(如果没有自定义图)
        if (!photoLoaded) {
          loadingEl.classList.add('show');
          try {
            const info = await loadSpotPhoto(spot);
            if (info && (info.large || info.medium)) {
              photoUrl = info.large || info.medium;
              photoEl.src = photoUrl;
              photoEl.onload = () => {
                photoEl.classList.add('loaded');
                loadingEl.classList.remove('show');
              };
              photoEl.onerror = () => {
                loadingEl.textContent = '照片暂不可用';
              };
            } else {
              loadingEl.textContent = '暂无实景照片';
            }
          } catch (e) {
            loadingEl.textContent = '加载失败';
          }
          photoLoaded = true;
        }
      } else {
        // 切回水彩
        wrap.classList.remove('show-photo');
        toggleBtn.dataset.mode = 'painting';
        toggleBtn.querySelector('.toggle-icon').textContent = '📷';
        toggleBtn.querySelector('.toggle-text').textContent = '实景';
      }
    });
    
    // 上传按钮 - 点击触发文件选择
    if (uploadBtn && fileInput) {
      // 短按 = 选图;长按 = 清除
      let pressTimer = null;
      let didLongPress = false;
      
      uploadBtn.addEventListener('mousedown', () => {
        didLongPress = false;
        pressTimer = setTimeout(() => {
          didLongPress = true;
          if (uploadBtn.classList.contains('has-custom')) {
            if (confirm(`移除「${spot.name}」的自定义图片?`)) {
              localStorage.removeItem(customKey);
              uploadBtn.classList.remove('has-custom');
              uploadBtn.title = '换一张自定义图片';
              // 重置照片状态,让下次切换重新加载默认
              photoEl.src = '';
              photoEl.classList.remove('loaded');
              photoLoaded = false;
              photoUrl = null;
            }
          }
        }, 600);
      });
      uploadBtn.addEventListener('mouseup', () => clearTimeout(pressTimer));
      uploadBtn.addEventListener('mouseleave', () => clearTimeout(pressTimer));
      
      uploadBtn.addEventListener('click', (e) => {
        if (didLongPress) {
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        fileInput.click();
      });
      
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        // 文件大小限制 5MB
        if (file.size > 5 * 1024 * 1024) {
          alert('图片过大,请用 5MB 以下的图片');
          return;
        }
        
        // 读取为 dataURL + 压缩(保持长边 1200,转 JPEG quality 0.85)
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 1200;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              const ratio = w > h ? maxDim / w : maxDim / h;
              w = Math.round(w * ratio);
              h = Math.round(h * ratio);
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const compressedDataURL = canvas.toDataURL('image/jpeg', 0.85);
            
            try {
              localStorage.setItem(customKey, compressedDataURL);
            } catch (err) {
              alert('图片太大,无法保存(浏览器存储限制)。请用更小的图片');
              return;
            }
            
            // 应用到 photo
            photoUrl = compressedDataURL;
            photoEl.src = compressedDataURL;
            photoEl.onload = () => {
              photoEl.classList.add('loaded');
              loadingEl.classList.remove('show');
            };
            photoLoaded = true;
            uploadBtn.classList.add('has-custom');
            uploadBtn.title = '点击换图,长按恢复默认';
            
            // 自动切到照片模式
            if (toggleBtn.dataset.mode === 'painting') {
              toggleBtn.click();
            }
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
        
        // 清空 input,允许同一个文件再次选择
        fileInput.value = '';
      });
    }
    
    // 导出按钮 - 把当前图片(localStorage 里的)生成可粘贴的代码
    const exportBtn = document.querySelector(`.spot-scene-export[data-spot-idx="${idx}"]`);
    if (exportBtn) {
      exportBtn.addEventListener('click', () => {
        const localImage = localStorage.getItem(customKey);
        if (!localImage) {
          alert(`请先用 ✏️ 上传一张图片到「${spot.name}」`);
          return;
        }
        showExportDialog(spot.name, localImage);
      });
    }
  }, 50);
}

// 导出对话框 - 显示可复制的代码片段
function showExportDialog(spotName, dataURL) {
  // 移除已有的对话框
  document.querySelector('.export-dialog-overlay')?.remove();
  
  // 生成代码片段
  const code = `  '${spotName}': '${dataURL}',`;
  const sizeKB = Math.round(dataURL.length / 1024);
  
  const overlay = document.createElement('div');
  overlay.className = 'export-dialog-overlay';
  overlay.innerHTML = `
    <div class="export-dialog">
      <div class="export-dialog-head">
        <span class="export-dialog-title">导出「${spotName}」的自定义图片</span>
        <button class="export-dialog-close" aria-label="关闭对话框">×</button>
      </div>
      <div class="export-dialog-body">
        <p class="export-step"><strong>步骤 1:</strong> 复制下面的代码(约 ${sizeKB} KB)</p>
        <textarea class="export-textarea" readonly>${code}</textarea>
        <button class="export-copy-btn">📋 复制代码</button>
        <p class="export-step"><strong>步骤 2:</strong> 用文本编辑器打开你的 HTML 文件,找到这个标记:</p>
        <pre class="export-marker">// ↓↓↓ 在这里粘贴你导出的图片数据 ↓↓↓</pre>
        <p class="export-step"><strong>步骤 3:</strong> 在标记下面那一行粘贴代码,保存 HTML 文件</p>
        <p class="export-step"><strong>步骤 4:</strong> 任何人打开你的 HTML 都能看到这张图了!</p>
        <p class="export-note">💡 如果想换图,可以替换或追加新的赏花点(每个赏花点一行)</p>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  
  const close = () => overlay.remove();
  overlay.querySelector('.export-dialog-close').addEventListener('click', close);
  overlay.addEventListener('click', e => {
    if (e.target === overlay) close();
  });
  
  // 复制按钮
  overlay.querySelector('.export-copy-btn').addEventListener('click', async () => {
    const ta = overlay.querySelector('.export-textarea');
    try {
      await navigator.clipboard.writeText(ta.value);
      const btn = overlay.querySelector('.export-copy-btn');
      const orig = btn.textContent;
      btn.textContent = '✓ 已复制!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = orig;
        btn.classList.remove('copied');
      }, 2000);
    } catch (err) {
      // fallback
      ta.select();
      document.execCommand('copy');
      alert('已复制到剪贴板');
    }
  });
}

// 绘制赏花点的水彩意境画 (canvas) -- 一个场景画,不是单朵花
function drawSpotScene(canvas, spot) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  
  let seed = spot._idx || 0;
  for (let i = 0; i < spot.name.length; i++) seed = (seed * 31 + spot.name.charCodeAt(i)) | 0;
  const rand = mulberry32(seed * 7919);
  const color = hexToRgb(spot.color);
  
  // 1. 背景水彩天空(根据花种和季节决定底色)
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.65);
  // 根据月份选择天空色
  const isWinter = spot.months.some(m => [12,1,2].includes(m));
  const isAutumn = spot.months.some(m => [9,10,11].includes(m));
  const isSummer = spot.months.some(m => [6,7,8].includes(m));
  if (isWinter) {
    skyGrad.addColorStop(0, '#e8e4dc'); skyGrad.addColorStop(1, '#f5f0e4');
  } else if (isAutumn) {
    skyGrad.addColorStop(0, '#f5dcaa'); skyGrad.addColorStop(1, '#faecd0');
  } else if (isSummer) {
    skyGrad.addColorStop(0, '#cfd8e0'); skyGrad.addColorStop(1, '#f0e8cc');
  } else {
    skyGrad.addColorStop(0, '#e0d8c4'); skyGrad.addColorStop(1, '#f5ecd5');
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);
  
  // 2. 远山(山影)
  ctx.fillStyle = 'rgba(155, 145, 130, 0.42)';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.55);
  for (let x = 0; x <= W; x += 12) {
    const y = H * 0.55 - 18 + Math.sin(x * 0.025 + 1.3) * 14 - Math.cos(x * 0.014) * 10;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.fill();
  
  ctx.fillStyle = 'rgba(125, 115, 100, 0.48)';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.65);
  for (let x = 0; x <= W; x += 10) {
    const y = H * 0.65 + Math.sin(x * 0.03 + 2) * 8 - Math.cos(x * 0.018) * 6;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  ctx.fill();
  
  // 3. 中景:大量花朵成片
  // 根据花种决定场景类型
  const flowerForm = getPlantForm(spot.type);
  
  if (flowerForm === 'water') {
    // 荷塘场景
    drawLotusScene(ctx, W, H, color, rand);
  } else if (spot.type === 'ginkgo' || spot.type === 'maple' || spot.type === 'poplar' || spot.type === 'birch' || spot.type === 'qionghua' || spot.type === 'lilac' || spot.type === 'crapemyrtle' || spot.type === 'phoenix' || spot.type === 'narcissus' || spot.type === 'wisteria' || spot.type === 'cherry' || spot.type === 'peach' || spot.type === 'apricot' || spot.type === 'plum' || spot.type === 'osmanthus' || spot.type === 'magnolia' || spot.type === 'kapok' || spot.type === 'meigui' || spot.type === 'rose' || spot.type === 'azalea' || spot.type === 'camellia') {
    // 树丛花海(适合木本)
    drawTreeFlowerScene(ctx, W, H, spot.type, color, rand);
  } else if (spot.type === 'canola' || spot.type === 'sunflower' || spot.type === 'lavender' || spot.type === 'tulip') {
    // 田园花海(草本)
    drawFieldScene(ctx, W, H, spot.type, color, rand);
  } else {
    // 默认:草地撒花
    drawTreeFlowerScene(ctx, W, H, spot.type, color, rand);
  }
  
  // 4. 前景剪影:加一点点笔触装饰
  ctx.strokeStyle = 'rgba(75, 60, 45, 0.18)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 8; i++) {
    ctx.beginPath();
    const x1 = rand() * W;
    const y1 = H * 0.7 + rand() * H * 0.3;
    ctx.moveTo(x1, y1);
    ctx.lineTo(x1 + (rand()-0.5)*20, y1 + rand()*10);
    ctx.stroke();
  }
  
  // 5. 水彩纸纹叠加(用 canvas 噪点)
  const imgData = ctx.getImageData(0, 0, W, H);
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    if (Math.random() < 0.05) {
      const v = (Math.random() - 0.5) * 20;
      data[i] = Math.max(0, Math.min(255, data[i] + v));
      data[i+1] = Math.max(0, Math.min(255, data[i+1] + v*0.9));
      data[i+2] = Math.max(0, Math.min(255, data[i+2] + v*0.7));
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

// 树丛花海场景
function drawTreeFlowerScene(ctx, W, H, type, color, rand) {
  const groundY = H * 0.72;
  // 几棵树的剪影 + 缀花
  const trees = 4 + Math.floor(rand() * 3);
  for (let i = 0; i < trees; i++) {
    const tx = W * (0.08 + (i / trees) * 0.88) + (rand() - 0.5) * 30;
    const trunkH = 60 + rand() * 30;
    const ty = groundY;
    // 树干
    ctx.strokeStyle = 'rgba(95, 70, 45, 0.7)';
    ctx.lineWidth = 2.5 + rand() * 1.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx + (rand()-0.5)*8, ty - trunkH*0.6, tx + (rand()-0.5)*5, ty - trunkH);
    ctx.stroke();
    // 几根分枝
    for (let b = 0; b < 3; b++) {
      const branchAng = -Math.PI/2 + (b - 1) * 0.5;
      const branchLen = 25 + rand() * 15;
      const sx = tx + (rand()-0.5)*4;
      const sy = ty - trunkH;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.cos(branchAng) * branchLen, sy + Math.sin(branchAng) * branchLen);
      ctx.stroke();
    }
    // 缀花 - 在树冠位置撒小花
    const flowerCount = 8 + Math.floor(rand() * 6);
    const crownR = 25 + rand() * 12;
    for (let j = 0; j < flowerCount; j++) {
      const a = rand() * Math.PI * 2;
      const r = rand() * crownR;
      const fx = tx + Math.cos(a) * r;
      const fy = ty - trunkH + Math.sin(a) * r * 0.7;
      const fs = 6 + rand() * 4;
      drawSmallFlower(ctx, fx, fy, fs, type, color, rand);
    }
  }
  
  // 地面撒落花瓣
  for (let i = 0; i < 30; i++) {
    const x = rand() * W;
    const y = groundY + rand() * (H - groundY) * 0.7;
    const fs = 4 + rand() * 3;
    drawSmallFlower(ctx, x, y, fs, type, color, rand);
  }
}

// 田园花海场景(油菜花/向日葵/薰衣草)
function drawFieldScene(ctx, W, H, type, color, rand) {
  const groundY = H * 0.58;
  // 大片花田,前后景纵深
  for (let row = 0; row < 6; row++) {
    const rowY = groundY + (row / 6) * (H - groundY);
    const flowerSize = 5 + (row / 6) * 8;
    const density = 30 + row * 8;
    for (let i = 0; i < density; i++) {
      const x = rand() * W;
      const y = rowY + (rand() - 0.5) * (H - groundY) / 6;
      const fs = flowerSize + (rand() - 0.5) * 3;
      drawSmallFlower(ctx, x, y, fs, type, color, rand);
    }
  }
  // 加点叶子混在花田下层
  if (type === 'lavender' || type === 'sunflower') {
    for (let i = 0; i < 20; i++) {
      const x = rand() * W;
      const y = groundY + rand() * (H - groundY);
      drawSwordLeaf(ctx, x, y + 8, 12 + rand() * 6, (rand()-0.5)*0.3, rand);
    }
  }
}

// 荷塘场景
function drawLotusScene(ctx, W, H, color, rand) {
  // 水面
  const waterGrad = ctx.createLinearGradient(0, H*0.5, 0, H);
  waterGrad.addColorStop(0, 'rgba(180, 200, 195, 0.6)');
  waterGrad.addColorStop(1, 'rgba(150, 175, 175, 0.7)');
  ctx.fillStyle = waterGrad;
  ctx.fillRect(0, H*0.5, W, H*0.5);
  
  // 水波纹
  ctx.strokeStyle = 'rgba(140, 170, 175, 0.4)';
  ctx.lineWidth = 0.6;
  for (let i = 0; i < 6; i++) {
    const y = H*0.55 + i * 12;
    ctx.beginPath();
    for (let x = 0; x < W; x += 8) {
      ctx.lineTo(x, y + Math.sin(x*0.08 + i)*2);
    }
    ctx.stroke();
  }
  
  // 几片大荷叶
  const leaves = [
    {x: W*0.15, y: H*0.78, r: 50},
    {x: W*0.45, y: H*0.85, r: 65},
    {x: W*0.78, y: H*0.72, r: 55},
    {x: W*0.30, y: H*0.62, r: 40},
    {x: W*0.65, y: H*0.6, r: 38}
  ];
  for (const l of leaves) {
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.fillStyle = `rgba(135, 158, 130, ${0.7 + rand()*0.15})`;
    ctx.beginPath();
    ctx.ellipse(0, 0, l.r, l.r * 0.5, (rand()-0.5)*0.2, 0, Math.PI*2);
    ctx.fill();
    // 叶脉
    ctx.strokeStyle = 'rgba(95, 120, 95, 0.5)';
    ctx.lineWidth = 0.6;
    for (let i = -3; i <= 3; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(i*l.r*0.3, -l.r*0.45);
      ctx.stroke();
    }
    ctx.restore();
  }
  
  // 高出水面的荷花
  const flowers = [
    {x: W*0.22, y: H*0.42, size: 22},
    {x: W*0.52, y: H*0.5, size: 26},
    {x: W*0.72, y: H*0.4, size: 20},
    {x: W*0.4, y: H*0.32, size: 18}
  ];
  for (const f of flowers) {
    // 茎
    ctx.strokeStyle = 'rgba(125, 150, 105, 0.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(f.x, f.y + f.size + H*0.05);
    ctx.lineTo(f.x + (rand()-0.5)*4, f.y);
    ctx.stroke();
    drawLotusFlower(ctx, f.x, f.y, f.size, color, rand);
  }
}

function selectCity(cityName) {
  selectedCity = cityName;
  const info = CITY_FLOWERS[cityName];

    const notesHTML = ext.notes ? `<div class="flower-notes">${ext.notes}</div>` : '';
    
    return `
      <div class="flower-block">
        <div class="flower-illust" data-type="${f.type}" data-latin="${f.latin}" data-name="${f.name}" data-mode="painting">

          <div class="details-content">

          </div>
        </details>
      </div>
    `;
  }).join('');

  const decreeHTML = info.decree ? `<div class="city-decree">${info.decree}</div>` : '';
  
  body.innerHTML = `
    <div class="info-card">
      <div class="city-name">${cityName}</div>
      <div class="city-pinyin">${info.pinyin}</div>
      <div class="city-province">${info.province}</div>
      ${decreeHTML}
      ${flowersHTML}

  // 绑定切换按钮 - 点击时按需加载真实照片
  body.querySelectorAll('.flower-illust').forEach(el => {
    const type = el.dataset.type;
    const latin = el.dataset.latin;
    const photoImg = el.querySelector('.flower-photo');
    const loadingEl = el.querySelector('.flower-photo-loading');
    const toggleBtn = el.querySelector('.flower-toggle');
    if (!photoImg || !toggleBtn) return;
    
    let photoLoaded = false;
    
    toggleBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const mode = el.dataset.mode;
      if (mode === 'painting') {

        toggleBtn.querySelector('.toggle-icon').textContent = '🎨';
        toggleBtn.querySelector('.toggle-text').textContent = '画意';
        
        // 第一次切换时加载照片
        if (!photoLoaded) {
          if (loadingEl) loadingEl.classList.add('show');
          try {
            const info = await loadFlowerPhoto(type, latin);
            if (info && (info.large || info.medium)) {
              const url = info.large || info.medium;
              const preloader = new Image();
              preloader.onload = () => {
                photoImg.src = url;
                photoImg.classList.add('loaded');
                if (loadingEl) loadingEl.classList.remove('show');
              };
              preloader.onerror = () => {
                if (loadingEl) loadingEl.textContent = '照片暂不可用';
              };
              preloader.src = url;
            } else {
              if (loadingEl) loadingEl.textContent = '暂无实景照片';
            }
          } catch (err) {
            if (loadingEl) loadingEl.textContent = '加载失败';
          }
          photoLoaded = true;
        }
      } else {
        // 切回水彩
        el.dataset.mode = 'painting';
        toggleBtn.dataset.mode = 'painting';
        toggleBtn.querySelector('.toggle-icon').textContent = '📷';
        toggleBtn.querySelector('.toggle-text').textContent = '实景';
      }
    });
  });
}

// 计算"今日花信":根据当前真实日期推荐一个当月正在盛开的城市+花
function getTodayFlower() {
  const realMonth = new Date().getMonth() + 1; // 1-12
  // 找该月所有正在盛开的城市+花组合
  const bloomingPairs = [];
  for (const [city, info] of Object.entries(CITY_FLOWERS)) {
    for (const f of info.flowers) {
      if (f.months.includes(realMonth)) {
        bloomingPairs.push({city, flower: f, province: info.province});
      }
    }
  }
  if (bloomingPairs.length === 0) {
    // 该月没花?返回第一个
    const [city, info] = Object.entries(CITY_FLOWERS)[0];
    return {city, flower: info.flowers[0], province: info.province};
  }
  // 用今天日期生成种子 - 用 mulberry32 散开(避免简单 mod 落入同一桶)
  const today = new Date();
  // 哈希式种子:y*1000003 + m*10007 + d*97
  let seed = today.getFullYear() * 1000003 + (today.getMonth()+1) * 10007 + today.getDate() * 97;
  // 跑几步 mulberry32 让结果更分散
  const r = mulberry32(seed);
  r(); r(); // 跳过头两个值,避免初始相关性
  const idx = Math.floor(r() * bloomingPairs.length);
  return bloomingPairs[idx];
}

function initTodayCard() {

// 搜索功能
function initSearch() {
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');
  if (!input || !results) return;
  
  // 建立索引:city -> {flowerNames}
  const searchIndex = [];
  for (const [city, info] of Object.entries(CITY_FLOWERS)) {
    searchIndex.push({
      city,
      province: info.province,
      flowerNames: info.flowers.map(f => f.name).join('、'),
      flowers: info.flowers
    });
  }
  
  function doSearch(q) {
    q = q.trim().toLowerCase();
    if (!q) { results.classList.remove('show'); return; }
    
    const matches = [];
    for (const item of searchIndex) {
      // 匹配城市、省份、或花名
      if (
        item.city.toLowerCase().includes(q) ||
        item.province.toLowerCase().includes(q) ||
        item.flowerNames.toLowerCase().includes(q) ||
        item.flowers.some(f => f.latin && f.latin.toLowerCase().includes(q))
      ) {
        matches.push(item);
      }
      if (matches.length >= 12) break;
    }
    
    if (matches.length === 0) {
      results.innerHTML = '<div class="search-result-empty">未找到相关城市或花卉</div>';
    } else {
      results.innerHTML = matches.map(m => 
        `<div class="search-result-item" data-city="${m.city}">
          ${m.city} <span class="result-flower">${m.flowerNames}</span>
        </div>`
      ).join('');
    }
    results.classList.add('show');
  }
  
  input.addEventListener('input', e => doSearch(e.target.value));
  input.addEventListener('focus', e => { if (e.target.value) doSearch(e.target.value); });
  
  // 点击搜索结果
  results.addEventListener('click', e => {
    const item = e.target.closest('.search-result-item');
    if (!item) return;
    const city = item.dataset.city;
    selectCity(city);
    input.value = '';
    results.classList.remove('show');
  });
  
  // 点击外部关闭
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-wrap')) {
      results.classList.remove('show');
    }
  });
}

// 筛选功能
let activeFilter = null; // 当前激活的花种 type

function initFilter() {
  const btn = document.getElementById('filterBtn');
  const panel = document.getElementById('filterPanel');
  if (!btn || !panel) return;
  
  // 收集所有花种 → 中文名映射
  const flowerTypeMap = new Map(); // type -> {name, count}
  for (const [city, info] of Object.entries(CITY_FLOWERS)) {
    for (const f of info.flowers) {
      if (!flowerTypeMap.has(f.type)) {
        flowerTypeMap.set(f.type, {name: f.name, count: 0});
      }
      flowerTypeMap.get(f.type).count++;
    }
  }
  // 按数量排序
  const sortedTypes = [...flowerTypeMap.entries()].sort((a, b) => b[1].count - a[1].count);
  
  panel.innerHTML = `
    <div class="filter-panel-title">按花种筛选</div>
    <div class="filter-tags">
      ${sortedTypes.map(([type, info]) => 
        `<span class="filter-tag" data-type="${type}">${info.name} <small style="opacity:0.6">${info.count}</small></span>`
      ).join('')}
    </div>
    <button class="filter-clear">清除筛选</button>
  `;
  
  btn.addEventListener('click', e => {
    e.stopPropagation();
    panel.classList.toggle('show');
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.filter-panel') && !e.target.closest('#filterBtn')) {
      panel.classList.remove('show');
    }
  });
  
  panel.addEventListener('click', e => {
    const tag = e.target.closest('.filter-tag');
    if (tag) {
      const type = tag.dataset.type;
      activeFilter = (activeFilter === type) ? null : type;
      panel.querySelectorAll('.filter-tag').forEach(t => {
        t.classList.toggle('active', t.dataset.type === activeFilter);
      });
      applyFilter();
      btn.classList.toggle('active', !!activeFilter);
      return;
    }
    if (e.target.classList.contains('filter-clear')) {
      activeFilter = null;
      panel.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
      applyFilter();
      btn.classList.remove('active');
    }
  });
}

function applyFilter() {
  document.querySelectorAll('.city-dot').forEach(dot => {
    const city = dot.dataset.city;
    const info = CITY_FLOWERS[city];
    if (!info) return;
    const match = !activeFilter || info.flowers.some(f => f.type === activeFilter);
    dot.classList.toggle('filtered-out', !match);
    const labelGroup = document.querySelector(`.city-label-group[data-city="${city}"]`);
    if (labelGroup) labelGroup.classList.toggle('filtered-out', !match);
  });
}

// 定位功能(用 IP 地理位置 API)
function initLocate() {
  const btn = document.getElementById('locateBtn');
  if (!btn) return;
  
  btn.addEventListener('click', async () => {
    const originalText = btn.textContent;
    btn.textContent = '⏳ 定位中…';
    btn.disabled = true;
    
    try {
      // 优先 IP 定位(无需用户授权)
      const res = await fetch('https://ipapi.co/json/');
      const data = await res.json();
      const userCity = (data.city || '').replace(/市|区|县/g, '');
      
      // 在 CITY_FLOWERS 里找最匹配的
      let matched = null;
      for (const cityName of Object.keys(CITY_FLOWERS)) {
        if (cityName === userCity || userCity.includes(cityName) || cityName.includes(userCity)) {
          matched = cityName;
          break;
        }
      }
      
      if (matched) {
        selectCity(matched);
        btn.textContent = `📍 ${matched}`;
      } else {
        // 没找到对应城市,看是否有省份的省会
        const userRegion = data.region || '';
        for (const [city, info] of Object.entries(CITY_FLOWERS)) {
          if (info.province && (info.province.includes(userRegion) || userRegion.includes(info.province.replace(/省|市|自治区/g, '')))) {
            matched = city;
            break;
          }
        }
        if (matched) {
          selectCity(matched);
          btn.textContent = `📍 ${matched}`;
        } else {
          btn.textContent = '📍 未匹配';
          setTimeout(() => { btn.textContent = originalText; }, 2000);
        }
      }
    } catch (e) {
      console.error('Locate failed:', e);
      btn.textContent = '📍 定位失败';
      setTimeout(() => { btn.textContent = originalText; }, 2000);
    } finally {
      btn.disabled = false;
    }
  });
}

function initLayerSwitch() {
  const buttons = document.querySelectorAll('.layer-btn');
  const map = document.getElementById('map');
  if (!map) return;
  map.classList.add('layer-city');
  
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const layer = btn.dataset.layer;
      if (layer === currentLayer) return;
      
      currentLayer = layer;
      buttons.forEach(b => b.classList.toggle('active', b.dataset.layer === layer));
      
      // 切换地图 class

      // 提示

          : `${FLOWER_SPOTS.length} 处赏花胜地 · 按月切换`;
      }

      updateSpotBlooms();

// 根据当月更新赏花点的盛放状态

  document.querySelectorAll('.spot-marker').forEach(marker => {

function initShareButton() {
  // 监听 sidebarBody 变化,当选中城市后,在卡片右上角加分享按钮
